name: Rerun Failures (WJ-5)

# Auto-dispatched by the main pipeline's `trigger-rerun` job when the `rerun_failed`
# checkbox was ticked. Re-runs ONLY the failed tests of a source run:
#   collect (aggregate failed test IDs) -> rerun (--last-failed, auto-sized shards)
#   -> publish (merged report + Pages deploy) -> notify (Slack: flaky vs still-failing)
# All params are inherited from the source run (the dispatcher passes them in);
# shard count is auto = ceil(failures / tests_per_shard).

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID whose failures to re-run (the main run on pass 1; the previous rerun on later passes)"
        required: true
        type: string
      origin_run_number:
        description: "The ORIGINAL main run NUMBER (e.g. 284) — constant across the chain; drives report keys/labels and ties reruns to their parent main run. Falls back to source_run_id if empty."
        required: false
        default: ""
        type: string
      branch:
        description: "Private-repo branch (inherited from source run)"
        required: true
        default: "main"
        type: string
      environment:
        required: true
        default: "stage"
        type: string
      credential_set:
        required: true
        default: "Aut_Eng_01"
        type: string
      browser:
        required: true
        default: "chrome"
        type: string
      keep_last_runs:
        required: true
        default: "50"
        type: string
      distribute_by_test:
        required: false
        default: false
        type: boolean
      num_retries:
        required: true
        default: "2"
        type: string
      video_mode:
        required: true
        default: "off"
        type: string
      trace_mode:
        required: true
        default: "retain-on-first-failure"
        type: string
      run_reason:
        required: true
        default: "RETRY FAILURES:"
        type: string
      tests_per_shard:
        description: "Target tests per rerun shard (shard count = ceil(failures / this))"
        required: false
        default: "5"
        type: string
      rerun_passes:
        description: "Total rerun passes requested (chaining). Pass N re-runs pass N-1's still-failing tests."
        required: false
        default: "1"
        type: string
      pass_number:
        description: "Which pass this run is (1-based; incremented on each self-dispatch)"
        required: false
        default: "1"
        type: string

env:
  TEST_ENV: ${{ inputs.environment }}
  CREDENTIAL_SET: ${{ inputs.credential_set }}
  NUM_RETRIES: ${{ inputs.num_retries }}
  VIDEO_MODE: ${{ inputs.video_mode }}
  TRACE_MODE: ${{ inputs.trace_mode }}
  SLOW_MODE_DELAY_IN_MS: 0
  CI: "true"
  PLAYWRIGHT_WORKERS: 1
  NODE_VERSION: "20"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # allows the chain-next job to self-dispatch the next rerun pass

jobs:
  # ── Aggregate the source run's failed test IDs and size the rerun ──────────
  collect:
    name: Collect Failures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      failed_count: ${{ steps.plan.outputs.failed_count }}
      has_failures: ${{ steps.plan.outputs.has_failures }}
    steps:
      - name: Download source run shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-artifacts
          # Per-shard artifacts carry test-results/last-run.json. The pattern matches
          # BOTH the main run (playwright-report-shard-*) and a prior rerun pass
          # (rerun-report-shard-*), so chaining (pass N reruns pass N-1) works.
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern "*report-shard-*" \
            --dir src-artifacts || echo "::warning::no shard artifacts found"
          echo "Downloaded:"; ls src-artifacts 2>/dev/null || true

      - name: Aggregate failed test IDs & plan shards
        id: plan
        env:
          TESTS_PER_SHARD: ${{ inputs.tests_per_shard }}
        run: |
          node <<'SCRIPT'
          const fs = require('fs'), path = require('path');
          const root = 'src-artifacts';
          const per = Math.max(1, parseInt(process.env.TESTS_PER_SHARD || '5', 10));
          const CAP = 20; // never explode into more than this many rerun shards
          const failed = new Set();
          let dirs = [];
          try { dirs = fs.readdirSync(root).filter(d => /report-shard-\d+$/.test(d)); }
          catch (e) { console.warn('no src-artifacts dir'); }
          for (const d of dirs) {
            const f = path.join(root, d, 'test-results', 'last-run.json');
            if (!fs.existsSync(f)) continue;
            try {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              for (const id of (j.failedTests || [])) failed.add(id);
            } catch (e) { console.error('parse fail', f, e.message); }
          }
          const ids = [...failed];
          const count = ids.length;
          const N = count === 0 ? 0 : Math.min(CAP, Math.ceil(count / per));
          // Split the failed IDs ROUND-ROBIN into N balanced per-shard slices, one
          // .last-run.json each. Each rerun shard runs --last-failed against its OWN
          // slice (no --shard) -> even ~per/shard load (no OOM), independent of
          // Playwright's --shard/--last-failed ordering.
          fs.mkdirSync('slices', { recursive: true });
          const slices = Array.from({ length: N }, () => []);
          ids.forEach((id, j) => slices[j % N].push(id));
          for (let i = 0; i < N; i++) {
            fs.writeFileSync(`slices/shard-${i + 1}.json`, JSON.stringify({ status: 'failed', failedTests: slices[i] }));
          }
          const matrix = JSON.stringify({ shard: Array.from({ length: N }, (_, i) => i + 1) });
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `failed_count=${count}\n`);
          fs.appendFileSync(out, `shard_count=${N}\n`);
          fs.appendFileSync(out, `has_failures=${count > 0}\n`);
          fs.appendFileSync(out, `matrix=${matrix}\n`);
          console.log(`Aggregated ${count} failed test(s) -> ${N} rerun shard(s) (~${per}/shard, round-robin slices)`);
          SCRIPT

      - name: Upload per-shard slices
        if: steps.plan.outputs.has_failures == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: rerun-slices
          path: slices/
          retention-days: 7

  # ── Preview which failed tests land on which rerun shard ───────────────────
  # Same value as the main pipeline's map, reusing the SAME shared scripts +
  # template (list-shards.sh + build-distribution-map.js + distribution-map-template).
  # Only difference: selection is --last-failed (not --grep). Runs in parallel
  # with the rerun.
  distribution-map:
    name: Rerun Shard Distribution Map
    needs: collect
    if: needs.collect.outputs.has_failures == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: SunilsForge/WJ-5_Pub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Restore per-shard slices
        uses: actions/download-artifact@v7
        with:
          name: rerun-slices
          path: slices
      - name: Checkout runner repo for template
        uses: actions/checkout@v5
        with:
          path: runner-repo
      - name: List each shard's slice
        shell: bash
        env:
          TEST_ENV: ${{ inputs.environment }}
          PROJECT: ${{ inputs.browser }}
          N: ${{ needs.collect.outputs.shard_count }}
        run: |
          mkdir -p dist-map test-results
          # Each shard's tests = its pre-computed slice. --last-failed reads the
          # single test-results/.last-run.json, so place each slice then list, one
          # at a time (serial, no shared-file clobber). Mirrors the real rerun.
          for i in $(seq 1 "$N"); do
            cp "slices/shard-${i}.json" test-results/.last-run.json
            PLAYWRIGHT_JSON_OUTPUT_NAME="dist-map/shard-${i}.json" \
              npx cross-env test="${TEST_ENV}" npx playwright test \
                --list --reporter=json --last-failed --project="${PROJECT}" >/dev/null 2>&1 || true
            [ -s "dist-map/shard-${i}.json" ] || echo "::warning::no list output for slice ${i}"
          done
          echo "Listed $(ls dist-map/shard-*.json 2>/dev/null | wc -l) of $N slices"
      - name: Build HTML distribution map
        env:
          SHARD_COUNT: ${{ needs.collect.outputs.shard_count }}
          TEST_PATTERN: "--last-failed slices (rerun of main #${{ inputs.origin_run_number != '' && inputs.origin_run_number || inputs.source_run_id }})"
          BROWSER: ${{ inputs.browser }}
          TEST_ENV: ${{ inputs.environment }}
          DISTRIBUTE_BY_TEST: ${{ inputs.distribute_by_test }}
        run: node runner-repo/.github/scripts/build-distribution-map.js
      - name: Upload distribution map
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rerun-shard-distribution-map
          path: dist-map/index.html
          retention-days: 30

  # ── Re-run ONLY the failed tests, sharded, using --last-failed ─────────────
  rerun:
    name: "Rerun shard ${{ matrix.shard }}"
    needs: collect
    if: needs.collect.outputs.has_failures == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.collect.outputs.matrix) }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: SunilsForge/WJ-5_Pub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # NOTE: no distribution codemod here — each shard runs an EXPLICIT slice of
      # failed tests (below), so even distribution no longer depends on Playwright
      # sharding or mode:"parallel". That also keeps each shard's load bounded
      # (~tests_per_shard), which avoids the rerun OOM.

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install-deps
      - name: Install Playwright browser
        run: npx playwright install ${{ inputs.browser }}

      - name: Restore per-shard slices
        uses: actions/download-artifact@v7
        with:
          name: rerun-slices
          path: slices
      - name: Place this shard's slice as the --last-failed marker
        run: |
          mkdir -p test-results
          cp "slices/shard-${{ matrix.shard }}.json" test-results/.last-run.json

      - name: Re-run failed tests (this shard's slice)
        id: run_tests
        continue-on-error: true
        env:
          SHARD_NUMBER: ${{ matrix.shard }}
          CREDENTIAL_SET: ${{ env.CREDENTIAL_SET }}
          VIDEO_MODE: ${{ inputs.video_mode }}
          TRACE_MODE: ${{ inputs.trace_mode }}
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          echo "Rerun shard ${{ matrix.shard }} of ${{ needs.collect.outputs.shard_count }} (this shard's failed slice)"
          # No --shard: this shard's .last-run.json already contains ONLY its slice.
          npx cross-env test=${{ env.TEST_ENV }} npx playwright test \
            --last-failed \
            --project=${{ inputs.browser }} \
            --workers=1 \
            --retries=${{ env.NUM_RETRIES }} \
            --reporter=html,json,blob

      - name: Preserve last-failed marker
        # Non-dotted copy so upload-artifact keeps it; the NEXT pass's collect
        # aggregates these to re-run only this pass's still-failing tests.
        if: always()
        run: cp test-results/.last-run.json test-results/last-run.json 2>/dev/null || true
      - name: Upload rerun results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rerun-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            results.json
            blob-report/
          retention-days: 30

  # ── Merge rerun results, classify flaky vs real, build report, deploy Pages ─
  publish:
    name: Publish Rerun Report
    needs: [collect, rerun]
    if: always() && needs.collect.outputs.has_failures == 'true'
    runs-on: ubuntu-latest
    outputs:
      pages_url: ${{ steps.deployment.outputs.page_url }}
      flaky: ${{ steps.classify.outputs.flaky }}
      still_failing: ${{ steps.classify.outputs.still_failing }}
      reran: ${{ steps.classify.outputs.reran }}
      should_chain: ${{ steps.chain.outputs.should_chain }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all rerun artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout runner repo for templates
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Generate native Playwright merged report
        # Merge every rerun shard's blob report into one native Playwright HTML
        # report (errors, steps, failure screenshots) — same as the main pipeline's
        # merged report. `playwright` package ships the merge-reports CLI, so npx
        # works without npm ci. Output lands in playwright-report/ by default.
        run: |
          mkdir -p all-blob-reports
          # IMPORTANT: rerun shards run WITHOUT --shard (each has its own slice), so
          # Playwright names every shard's blob identically ("report.zip" — it only
          # appends an index when --shard is set). Copying them into one dir would
          # overwrite, leaving a merged report with just ONE shard's tests. Rename
          # each to report-<shard>.zip (Playwright's own sharded convention) using
          # the shard number from the artifact directory name.
          for dir in all-artifacts/rerun-report-shard-*/blob-report; do
            [ -d "$dir" ] || continue
            shard=$(basename "$(dirname "$dir")"); shard="${shard##*-shard-}"
            i=0
            for f in "$dir"/*.zip; do
              [ -f "$f" ] || continue
              if [ "$i" -eq 0 ]; then out="report-${shard}.zip"; else out="report-${shard}-${i}.zip"; fi
              cp "$f" "all-blob-reports/${out}"
              i=$((i + 1))
            done
          done
          echo "Collected $(ls all-blob-reports/*.zip 2>/dev/null | wc -l) blob(s): $(ls all-blob-reports 2>/dev/null | tr '\n' ' ')"
          if [ "$(ls all-blob-reports 2>/dev/null | wc -l)" -gt 0 ]; then
            npx playwright@1.59.1 merge-reports --reporter=html all-blob-reports || true
            if [ -d playwright-report ]; then
              mkdir -p rerun-report
              mv playwright-report rerun-report/playwright-merged
              echo "Native Playwright report -> rerun-report/playwright-merged/"
            else
              echo "::warning::merge-reports produced no output"
            fi
          else
            echo "No blob reports found — skipping native merge"
          fi

      - name: Classify results & build report
        id: classify
        env:
          # Show the ORIGINAL main run in the report (falls back to source on a
          # manual dispatch without origin).
          SOURCE_RUN_ID: ${{ inputs.origin_run_number != '' && inputs.origin_run_number || inputs.source_run_id }}
          RUN_REASON: ${{ inputs.run_reason }}
          TEST_ENV: ${{ inputs.environment }}
          BROWSER: ${{ inputs.browser }}
          PASS_NUMBER: ${{ inputs.pass_number }}
          RERUN_PASSES: ${{ inputs.rerun_passes }}
        run: node runner-repo/.github/scripts/build-rerun-report.js

      - name: Decide whether to chain another pass
        id: chain
        env:
          STILL: ${{ steps.classify.outputs.still_failing }}
          PASS: ${{ inputs.pass_number }}
          MAX: ${{ inputs.rerun_passes }}
        run: |
          still="${STILL:-0}"; pass="${PASS:-1}"; max="${MAX:-1}"
          if [ "${still:-0}" -gt 0 ] && [ "${pass:-1}" -lt "${max:-1}" ]; then
            echo "should_chain=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_chain=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pass=$pass max=$max still_failing=$still -> chain further: $([ "${still:-0}" -gt 0 ] && [ "${pass:-1}" -lt "${max:-1}" ] && echo yes || echo no)"

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Place report & update history
        run: |
          # Key = {original main run}-retry-p{pass} so every pass is traceable to
          # its main run AND sorts next to it (prefix is the main run number).
          ORIGIN="${{ inputs.origin_run_number }}"; ORIGIN="${ORIGIN:-${{ inputs.source_run_id }}}"
          RUNKEY="${ORIGIN}-retry-p${{ inputs.pass_number }}"
          mkdir -p "gh-pages/reports/${RUNKEY}"
          cp -r rerun-report/* "gh-pages/reports/${RUNKEY}/"
          cd gh-pages
          ENTRY=$(cat <<EOF
          {"runNumber":"${RUNKEY}","parentRunNumber":"${ORIGIN}","pass":${{ inputs.pass_number }},"runReason":"${{ inputs.run_reason }}","environment":"${{ inputs.environment }}","browser":"${{ inputs.browser }}","isRerun":true,"totalTests":${{ steps.classify.outputs.reran }},"totalPassed":${{ steps.classify.outputs.flaky }},"totalFailed":${{ steps.classify.outputs.still_failing }}}
          EOF
          )
          for HIST in run-history.json run-history.master.json; do
            if [ -f "$HIST" ]; then
              jq --argjson e "$ENTRY" '[$e] + . ' "$HIST" > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"
            else
              echo "[$ENTRY]" > "$HIST"
            fi
          done

      - name: Commit gh-pages
        run: |
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Rerun report for #${{ inputs.source_run_id }}" || echo "nothing to commit"
          git push origin gh-pages || echo "push skipped"

      - name: Build pruned deploy view
        run: |
          cd gh-pages
          KEEP="${{ inputs.keep_last_runs }}"; KEEP="${KEEP:-50}"
          DEPLOY_DIR="../site-deploy"
          mkdir -p "$DEPLOY_DIR/reports"
          [ -f index.html ] && cp index.html "$DEPLOY_DIR/index.html" || true
          [ -f run-history.master.json ] && cp run-history.master.json "$DEPLOY_DIR/" || true
          DASH="$GITHUB_WORKSPACE/runner-repo/.github/templates/dashboard-template.html"
          if [ -f "$DASH" ]; then mkdir -p "$DEPLOY_DIR/dashboard"; cp "$DASH" "$DEPLOY_DIR/dashboard/index.html"; fi
          # SAME parent-tied pruning as the main pipeline: keep the last N MAIN runs;
          # reruns ride with their parent (not counted against N). Keeps this rerun's
          # report AND prior reruns of the same main run visible together.
          jq --argjson n "$KEEP" '
            ([ .[].runNumber | tostring | select(test("^[0-9]+$")) | tonumber ] | unique | sort | reverse | .[:$n]) as $keptMain
            | map(select((.runNumber | tostring | split("-")[0] | tonumber?) as $mk | $mk != null and ($keptMain | index($mk) != null)))
            | sort_by(.runNumber | tostring | split("-")[0] | tonumber? // 0) | reverse
          ' run-history.json > "$DEPLOY_DIR/run-history.json" 2>/dev/null || cp run-history.json "$DEPLOY_DIR/run-history.json"
          # Copy report folders for every kept entry (main runs AND their reruns).
          for r in $(jq -r '.[].runNumber' "$DEPLOY_DIR/run-history.json"); do
            [ -d "reports/$r" ] && { mkdir -p "$DEPLOY_DIR/reports/$r"; cp -r "reports/$r/." "$DEPLOY_DIR/reports/$r/"; } || true
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Delete stale Pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages") | .id] | .[]' 2>/dev/null) || true
          for AID in $IDS; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$AID" || true; done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Slack: headline the flaky-vs-real split ────────────────────────────────
  # ── Chain the next rerun pass (ReReRun…) if requested and still not clean ──
  # Self-dispatches THIS same workflow with source_run_id = this run, pass_number+1.
  # Guarded by publish's should_chain (still_failing > 0 AND pass_number < rerun_passes),
  # so it stops automatically once the suite is clean or the pass cap is reached.
  chain-next:
    name: Trigger Next Rerun Pass
    needs: [collect, publish]
    if: always() && needs.collect.outputs.has_failures == 'true' && needs.publish.outputs.should_chain == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch next rerun pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT=$(( ${{ inputs.pass_number }} + 1 ))
          # Carry the ORIGINAL main run id unchanged down the chain (fallback to
          # source_run_id if this pass was dispatched without one).
          ORIGIN="${{ inputs.origin_run_number }}"; ORIGIN="${ORIGIN:-${{ inputs.source_run_id }}}"
          gh workflow run rerun-failures.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f source_run_id="${{ github.run_id }}" \
            -f origin_run_number="$ORIGIN" \
            -f branch="${{ inputs.branch }}" \
            -f environment="${{ inputs.environment }}" \
            -f credential_set="${{ inputs.credential_set }}" \
            -f browser="${{ inputs.browser }}" \
            -f keep_last_runs="${{ inputs.keep_last_runs }}" \
            -f distribute_by_test="${{ inputs.distribute_by_test }}" \
            -f num_retries="${{ inputs.num_retries }}" \
            -f video_mode="${{ inputs.video_mode }}" \
            -f trace_mode="${{ inputs.trace_mode }}" \
            -f run_reason="${{ inputs.run_reason }}" \
            -f rerun_passes="${{ inputs.rerun_passes }}" \
            -f pass_number="$NEXT"
          echo "Dispatched rerun pass $NEXT of ${{ inputs.rerun_passes }} (source = this run ${{ github.run_id }})"

  notify:
    name: Slack Notification (Rerun)
    needs: [collect, publish]
    if: always() && needs.collect.outputs.has_failures == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SOURCE_RUN_ID: ${{ inputs.origin_run_number != '' && inputs.origin_run_number || inputs.source_run_id }}
          RUN_REASON: ${{ inputs.run_reason }}
          TEST_ENV: ${{ inputs.environment }}
          BROWSER: ${{ inputs.browser }}
          PASS_NUMBER: ${{ inputs.pass_number }}
          RERUN_PASSES: ${{ inputs.rerun_passes }}
          RERAN: ${{ needs.publish.outputs.reran }}
          FLAKY: ${{ needs.publish.outputs.flaky }}
          STILL: ${{ needs.publish.outputs.still_failing }}
          PAGES_URL: ${{ needs.publish.outputs.pages_url }}
        run: |
          node <<'SCRIPT'
          const https = require('https'); const { URL } = require('url');
          const still = parseInt(process.env.STILL || '0', 10);
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const repoName = (process.env.GITHUB_REPOSITORY || '/').split('/')[1];
          const pages = process.env.PAGES_URL || `https://${owner}.github.io/${repoName}/`;
          const report = `${pages.replace(/\/$/, '')}/reports/${process.env.SOURCE_RUN_ID}-retry-p${process.env.PASS_NUMBER || '1'}/`;
          const actions = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const emoji = still > 0 ? '\u{1F534}' : '\u{1F7E2}';
          const passMax = process.env.RERUN_PASSES || '';
          const passSuffix = (passMax && passMax !== '1') ? ` (pass ${process.env.PASS_NUMBER}/${passMax})` : '';
          const blocks = [
            { type: 'header', text: { type: 'plain_text', text: `${emoji} 🔁 Rerun of Run #${process.env.SOURCE_RUN_ID}${passSuffix}`, emoji: true } },
            { type: 'section', fields: [
              { type: 'mrkdwn', text: `*Env:*\n${process.env.TEST_ENV}` },
              { type: 'mrkdwn', text: `*Browser:*\n${process.env.BROWSER}` },
              { type: 'mrkdwn', text: `*Reason:*\n${process.env.RUN_REASON || 'N/A'}` },
              { type: 'mrkdwn', text: `*Re-ran:*\n${process.env.RERAN}` },
            ]},
            { type: 'section', fields: [
              { type: 'mrkdwn', text: `*Now passing (flaky):* ${process.env.FLAKY} :white_check_mark:` },
              { type: 'mrkdwn', text: `*Still failing (real):* ${process.env.STILL} :x:` },
            ]},
            { type: 'actions', elements: [
              { type: 'button', text: { type: 'plain_text', text: 'Rerun Report', emoji: true }, url: report, style: 'primary' },
              { type: 'button', text: { type: 'plain_text', text: 'Actions Run', emoji: true }, url: actions },
            ]},
          ];
          const hook = process.env.SLACK_WEBHOOK_URL;
          if (!hook) { console.log('SLACK_WEBHOOK_URL not set — skipping'); process.exit(0); }
          const payload = JSON.stringify({ blocks }); const u = new URL(hook);
          const req = https.request({ hostname: u.hostname, port: 443, path: u.pathname, method: 'POST', timeout: 15000, headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) } }, res => {
            let b = ''; res.on('data', c => b += c); res.on('end', () => { console.log('Slack', res.statusCode, b); if (res.statusCode !== 200) process.exit(1); });
          });
          req.on('timeout', () => { req.destroy(); process.exit(1); });
          req.on('error', e => { console.error(e.message); process.exit(1); });
          req.write(payload); req.end();
          SCRIPT
