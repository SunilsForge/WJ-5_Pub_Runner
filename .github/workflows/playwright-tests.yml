name: Playwright Tests Runner for WJ-5

on:
  workflow_dispatch:
    inputs:
      keep_last_runs:
        description: "How many recent runs to publish on Pages"
        required: true
        default: "20"
        type: string
      branch:
        description: "Branch in SunilsForge/WJ-5_Pub to test"
        required: true
        default: "main"
        type: string
      environment:
        description: "Test environment (prodCanada/ prod/ prodTest/ stage/ qa)"
        required: true
        default: "stage"
      test_pattern:
        description: "Tag regex. OR: @TestDe|@DerivedScores — AND: (?=.*@RDGBAS)(?=.*@DerivedScores)"
        required: true
        default: "(?=.*@RDGBAS)(?=.*@DerivedScores)"
      credential_set:
        description: "Team member credential set (Aut_Eng_01 = default CI creds)"
        required: true
        default: "Aut_Eng_01"
        type: choice
        options:
          - "Aut_Eng_01"
          - "Aut_Eng_02"
          - "Aut_Eng_03"
          - "Aut_Eng_04"
          - "Aut_Eng_05"
          - "Aut_Eng_06"
      shard_count:
        description: "Number of shards"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
          - "8"
          - "10"
          - "15"
          - "20"
          - "25"
          - "40"
          - "95"
      distribute_by_test:
        description: "Balance shards by test count, not spec file. Affects only UIAndReports & ReroutingandLeftNav."
        required: false
        default: false
        type: boolean
      rerun_failed:
        description: "After this run, auto-trigger a pipeline that re-runs only the failed tests (own report + Slack)."
        required: false
        default: false
        type: boolean
      rerun_passes:
        description: "Rerun passes (needs rerun_failed). Each pass retries the last pass's failures; stops once clean. 2+ = final pass runs in slow-mo."
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      final_pass_slowmo_ms:
        description: "Slow-mo (ms) on the LAST rerun pass only, to settle timing-flaky tests. Needs rerun_passes 2+. That pass also gets 2x the test timeout."
        required: false
        default: "500"
        type: choice
        options:
          - "250"
          - "500"
          - "1000"
          - "1500"
          - "2000"
      browser:
        description: "Browser to run tests on"
        required: true
        default: "chrome"
        type: choice
        options:
          - "chrome"
          - "firefox"
          - "webkit"
      num_retries:
        description: "Number of test retries"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      video_mode:
        description: "Video recording mode"
        required: true
        default: "off"
        type: choice
        options:
          - "on"
          - "off"
          - "retain-on-failure"
          - "on-first-retry"
          - "retry-with-video"
      trace_mode:
        description: "Trace recording mode"
        required: true
        default: "off"
        type: choice
        options:
          - "on"
          - "off"
          - "on-all-retries"
          - "on-first-retry"
          - "retain-on-failure"
          - "retain-on-first-failure"
          - "retry-with-trace"
      log_raw_values:
        description: "Verbose raw-value logging (LOG_RAW_VALUES) — prints API responses to stdout. Debug runs only; cascades to reruns."
        required: false
        default: false
        type: boolean
      run_reason:
        description: "Run reason / pre-run notes. Optional directive: min_run=120"
        required: true
        default: "Env_@Tag_Reason"
        type: string

env:
  TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
  CREDENTIAL_SET: ${{ github.event.inputs.credential_set }}
  NUM_RETRIES: ${{ github.event.inputs.num_retries }}
  VIDEO_MODE: ${{ github.event.inputs.video_mode }}
  TRACE_MODE: ${{ github.event.inputs.trace_mode }}
  # RawValueLogger (test repo: src/utils/rawValueLogger.ts) latches this at MODULE
  # IMPORT time and compares it strictly to the string 'true' — so it must be in the
  # process env before Playwright starts. Set workflow-wide (not per-step) so every
  # job that spawns Playwright inherits it. A boolean input renders as `true`/`false`.
  LOG_RAW_VALUES: ${{ inputs.log_raw_values }}
  SLOW_MODE_DELAY_IN_MS: 0
  CI: "true"
  PLAYWRIGHT_WORKERS: 1
  NODE_VERSION: "20"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # allows the trigger-rerun job to dispatch the rerun-failures workflow

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # Real run start (UTC, YYYYMMDD_HHMMSS). Used for the history timestamp and the
      # report's Run Setup block. (github.event.created_at doesn't exist for
      # workflow_dispatch, which is why older history entries all show 00:00:00.)
      started_at: ${{ steps.set-matrix.outputs.started_at }}
    steps:
      - id: set-matrix
        run: |
          echo "started_at=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          SHARD_COUNT="${{ github.event.inputs.shard_count }}"
          SHARD_COUNT=${SHARD_COUNT:-1}
          # Dynamically generate shard array [1,2,...,N] — works for any count
          SHARDS=$(seq 1 "$SHARD_COUNT" | jq -cs '.')
          echo "matrix={\"shard\":${SHARDS}}" >> $GITHUB_OUTPUT

      - name: Save pre-run notes
        if: inputs.run_reason != ''
        # Free-text inputs go through env (never ${{ }} inside run:), so quotes / $() / backticks
        # in run_reason are plain data, not shell.
        env:
          RUN_REASON: ${{ inputs.run_reason }}
        run: |
          mkdir -p run-metadata
          printf '%s\n' "$RUN_REASON" > run-metadata/pre-run-notes.txt

      - name: Upload pre-run notes
        if: inputs.run_reason != ''
        uses: actions/upload-artifact@v6
        with:
          name: run-metadata
          path: run-metadata/
          retention-days: 90

  # Early preview of which tests land on which shard — deterministic, computed via
  # `playwright test --list --shard=i/N` (no browser launch, no test execution).
  # Runs in parallel with the heavy `test` job, so the HTML map is available within
  # a couple of minutes of kickoff, long before the pipeline finishes. Mirrors the
  # test job's checkout + distribution codemod so the map matches the real run.
  distribution-map:
    name: Shard Distribution Map
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: SunilsForge/WJ-5_Pub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      # After the test-repo checkout (which cleans the workspace), never before.
      - name: Checkout runner repo for shared scripts & template
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: "Enable per-test distribution (mirror test job)"
        # Same script as the test job so the previewed distribution matches the run.
        if: ${{ inputs.distribute_by_test }}
        shell: bash
        run: bash runner-repo/.github/scripts/distribute-by-test.sh

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      - name: Compute per-shard test lists
        shell: bash
        env:
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          TEST_ENV: ${{ env.TEST_ENV }}
          PROJECT: ${{ github.event.inputs.browser }}
          GREP: ${{ github.event.inputs.test_pattern }}
        run: bash runner-repo/.github/scripts/list-shards.sh

      - name: Build HTML distribution map
        env:
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          TEST_PATTERN: ${{ github.event.inputs.test_pattern }}
          BROWSER: ${{ github.event.inputs.browser }}
          TEST_ENV: ${{ env.TEST_ENV }}
          DISTRIBUTE_BY_TEST: ${{ inputs.distribute_by_test }}
        run: node runner-repo/.github/scripts/build-distribution-map.js

      - name: Upload distribution map
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shard-distribution-map
          path: dist-map/index.html
          retention-days: 30

  test:
    needs: prepare
    name: "Shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.prepare.outputs.matrix)}}
    steps:
      - name: Checkout private repository
        id: checkout-tests
        uses: actions/checkout@v5
        with:
          repository: SunilsForge/WJ-5_Pub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      # After the test-repo checkout (which cleans the workspace), never before.
      # Lands in runner-repo/, outside Playwright's testDir (./src/tests).
      - name: Checkout runner repo for shared scripts
        if: ${{ inputs.distribute_by_test }}
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: "Enable per-test distribution (UIAndReports & ReroutingandLeftNav only)"
        # OPT-IN. Flips the two folders' describes from serial to parallel so --shard
        # balances their scenarios by count. Ephemeral checkout only; see the script.
        # REQUIRE_CHANGES fails the shard if nothing changed (would mis-distribute).
        if: ${{ inputs.distribute_by_test }}
        # The Playwright container's default shell is sh (dash); pin bash.
        shell: bash
        env:
          REQUIRE_CHANGES: "true"
        run: bash runner-repo/.github/scripts/distribute-by-test.sh

      - name: Collect System Information
        run: |
          mkdir -p system-info
          echo "=== System Information for Shard ${{ matrix.shard }} ===" > system-info/specs.txt
          echo "CPU Information:" >> system-info/specs.txt
          lscpu >> system-info/specs.txt
          echo -e "\nMemory Information:" >> system-info/specs.txt
          free -h >> system-info/specs.txt
          echo -e "\nDisk Information:" >> system-info/specs.txt
          df -h >> system-info/specs.txt
          echo -e "\nSystem Load:" >> system-info/specs.txt
          uptime >> system-info/specs.txt
          echo -e "\nContainer Information:" >> system-info/specs.txt
          cat /etc/os-release >> system-info/specs.txt
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        # No `playwright install-deps`: the v1.59.1 container already ships every
        # browser's OS dependencies. `install <browser>` below still fetches the
        # browser itself (branded Chrome isn't in the image).
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install ${{ inputs.browser }}
      - name: Run Playwright tests
        id: run_tests
        continue-on-error: true
        env:
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          SHARD_NUMBER: ${{ matrix.shard }}
          CREDENTIAL_SET: ${{ env.CREDENTIAL_SET }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode }}
          TRACE_MODE: ${{ github.event.inputs.trace_mode }}
          # Inherited from the workflow env; restated here so the toggle is visible
          # at the point where Playwright is actually launched.
          LOG_RAW_VALUES: ${{ env.LOG_RAW_VALUES }}
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          GREP_PATTERN: ${{ github.event.inputs.test_pattern }}
        run: |
          echo "Running shard ${{ matrix.shard }} of ${{ github.event.inputs.shard_count }}"
          echo "Raw value logging (LOG_RAW_VALUES): ${LOG_RAW_VALUES:-false}"
          npx cross-env test="$TEST_ENV" npx playwright test \
            --grep "$GREP_PATTERN" \
            --project=${{ github.event.inputs.browser }} \
            --shard=${{ matrix.shard }}/${{ github.event.inputs.shard_count }} \
            --workers=1 \
            --retries=${{ env.NUM_RETRIES }} \
            --reporter=html,json,blob
      - name: Preserve last-failed marker
        # Playwright writes test-results/.last-run.json (failed test IDs). It's a
        # dotfile, which upload-artifact skips by default — copy to a non-dotted
        # name so it ships in the artifact for the rerun pipeline to aggregate.
        if: always()
        run: cp test-results/.last-run.json test-results/last-run.json 2>/dev/null || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            system-info/
            results.json
            blob-report/
          retention-days: 90
      - name: Create status file
        if: always()
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          TEST_PATTERN: ${{ github.event.inputs.test_pattern }}
          TESTED_COMMIT: ${{ steps.checkout-tests.outputs.commit }}
        run: |
          mkdir -p test-status
          # Exact WJ-5_Pub commit this shard tested (shown in the report's Run Setup).
          printf '%s\n' "${TESTED_COMMIT:-$(git rev-parse HEAD 2>/dev/null || echo unknown)}" > test-status/tested-commit.txt
          echo "${{ steps.run_tests.outcome }}" > test-status/status.txt
          echo "Shard: ${{ matrix.shard }}" >> test-status/status.txt
          printf 'Environment: %s\n' "$ENVIRONMENT" >> test-status/status.txt
          echo "Browser: ${{ github.event.inputs.browser }}" >> test-status/status.txt
          printf 'Test Pattern: %s\n' "$TEST_PATTERN" >> test-status/status.txt
          echo "Retries: ${{ env.NUM_RETRIES }}" >> test-status/status.txt
          echo "Video Mode: ${{ github.event.inputs.video_mode }}" >> test-status/status.txt
          echo "Trace Mode: ${{ github.event.inputs.trace_mode }}" >> test-status/status.txt
          echo "Raw Value Logging: ${{ inputs.log_raw_values }}" >> test-status/status.txt
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-status-shard-${{ matrix.shard }}
          path: test-status/
          retention-days: 30

  merge-reports:
    name: Merge Reports
    if: always()
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Checkout runner repo for templates
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Create merged report from template
        # "Run Setup" block = every trigger input + run context, so a report page
        # alone explains why/how the run happened. Also writes merged-report/run-setup.json
        # (deploy-report folds key fields into run-history for the history sidebar).
        # All values come from env and are HTML-escaped by the script.
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_STARTED_AT: ${{ needs.prepare.outputs.started_at }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUNNER_REF: ${{ github.ref_name }}
          RUNNER_SHA: ${{ github.sha }}
          TEST_REPO: SunilsForge/WJ-5_Pub
          BRANCH: ${{ inputs.branch }}
          ENVIRONMENT: ${{ inputs.environment }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
          CREDENTIAL_SET: ${{ inputs.credential_set }}
          BROWSER: ${{ inputs.browser }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          DISTRIBUTE_BY_TEST: ${{ inputs.distribute_by_test }}
          NUM_RETRIES: ${{ inputs.num_retries }}
          VIDEO_MODE: ${{ inputs.video_mode }}
          TRACE_MODE: ${{ inputs.trace_mode }}
          LOG_RAW_VALUES: ${{ inputs.log_raw_values }}
          RERUN_FAILED: ${{ inputs.rerun_failed }}
          RERUN_PASSES: ${{ inputs.rerun_passes }}
          FINAL_PASS_SLOWMO_MS: ${{ inputs.final_pass_slowmo_ms }}
          KEEP_LAST_RUNS: ${{ inputs.keep_last_runs }}
          RUN_REASON: ${{ inputs.run_reason }}
        run: |
          CURRENT_DATE=$(date -u +%Y-%m-%d_%H-%M-%S) node runner-repo/.github/scripts/fill-merged-report.js

          # Build shard entries into a temp file
          > shard_entries.html
          for ((i=1; i<=${{ inputs.shard_count }}; i++)); do
            report_source="all-artifacts/playwright-report-shard-$i"
            status_file="all-artifacts/test-status-shard-$i/status.txt"
            system_info_file="$report_source/system-info/specs.txt"
            if [ -d "$report_source" ]; then
              mkdir -p "merged-report/shard-$i"
              # Keep lightweight viewable data (PNG screenshots in playwright-report/data/) so the
              # per-shard report renders failure screenshots inline — matching the native merged report.
              # Excludes: test-results (raw attachments — redundant; playwright-report/data has them),
              #           blob-report (consumed for the native Timeline merge already),
              #           *.zip / *.webm / *.trace (heavy traces & videos — viewable from per-shard artifacts).
              # The deploy-report step applies an additional safety filter (*.mp4, *.gif, *.webp, files >100 MB)
              # when copying onto gh-pages. Full per-test attachments remain in the per-shard GitHub Actions artifact.
              rsync -av --exclude="test-results" --exclude="blob-report" \
                --exclude="*.zip" --exclude="*.webm" --exclude="*.trace" \
                "$report_source/" "merged-report/shard-$i/"
              status="N/A"
              status_class="status-neutral"
              if [ -f "$status_file" ]; then
                status=$(head -n 1 "$status_file")
                if [ "$status" = "success" ]; then
                  status_class="status-success"
                else
                  status_class="status-failure"
                fi
              fi
              # Distinguish "empty" shards (over-allocated — Playwright ran but had no tests to execute)
              # from real passes. Only override a SUCCESS — a failure stays a failure, an N/A stays N/A.
              # If jq can't read the file we leave status untouched (safer than mis-labelling).
              if [ "$status_class" = "status-success" ] && [ -f "$report_source/results.json" ]; then
                test_count=$(jq -r '((.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.skipped // 0) + (.stats.flaky // 0))' "$report_source/results.json" 2>/dev/null)
                if [ "$test_count" = "0" ]; then
                  status="NO TESTS"
                  status_class="status-empty"
                fi
              fi
              system_info="System information not available"
              if [ -f "$system_info_file" ]; then
                system_info=$(cat "$system_info_file")
              fi
              cat << EOF >> shard_entries.html
              <div class='report-wrapper'>
                <div class='report-link'>
                  <span>Shard $i Report</span>
                  <div>
                    <span class='status-badge ${status_class}'>$status</span>
                    <button class='expand-btn' data-shard='$i'>➤</button>
                  </div>
                </div>
                <div class='report-details' id='shard-$i-details'>
                  <div class='system-info-header'>
                    <button class='system-info-toggle' data-shard='$i'>
                      <span class="toggle-arrow">➤</span> System Information
                    </button>
                  </div>
                  <div class='system-info' id='system-info-$i'>
                    <pre>$system_info</pre>
                  </div>
                  <iframe data-src='./shard-$i/playwright-report/index.html'></iframe>
                </div>
              </div>
          EOF
            fi
          done

          # Insert shard entries into template
          sed -i '/<!-- SHARD_ENTRIES -->/r shard_entries.html' merged-report/index.html
          sed -i '/<!-- SHARD_ENTRIES -->/d' merged-report/index.html
          rm -f shard_entries.html
      - name: Generate native Playwright merged report (Timeline)
        run: |
          # Collect blob reports from all shards into a single directory
          mkdir -p all-blob-reports
          for dir in all-artifacts/playwright-report-shard-*/blob-report; do
            if [ -d "$dir" ]; then
              cp "$dir"/* all-blob-reports/ 2>/dev/null || true
            fi
          done

          BLOB_COUNT=$(ls all-blob-reports/ 2>/dev/null | wc -l)
          if [ "$BLOB_COUNT" -gt 0 ]; then
            echo "Found $BLOB_COUNT blob file(s) — generating native merged report..."
            # Pinned: this job has no npm ci, so a bare `npx playwright` would fetch the
            # LATEST release. Blobs must be merged by the version that wrote them —
            # keep in lockstep with the container image (same as the rerun publish).
            npx playwright@1.59.1 merge-reports --reporter=html all-blob-reports || true
            # Playwright outputs to playwright-report/ by default
            if [ -d "playwright-report" ]; then
              mv playwright-report merged-report/playwright-merged
              echo "Native merged report generated at merged-report/playwright-merged/"
            else
              echo "Warning: merge-reports ran but produced no output"
            fi
          else
            echo "No blob reports found — skipping native merge (Timeline will not be available)"
          fi

      - name: Extract counts and failure summary for dashboard
        # Writes two files INTO merged-report/ so they ship with the artifact and reach deploy-report:
        #   run-counts.json        — slim scalars (totalTests, totalPassed, totalFailed, totalSkipped, totalFlaky, durationMs)
        #                            → appended to run-history.master.json by deploy-report
        #   dashboard-summary.json — failure groups (errorType → tests) + flaky test names
        #                            → copied into reports/{runNumber}/ for the dashboard's failure/flaky charts
        # Forward-only: older runs without these files render as "unknown" in the dashboard.
        # Backwards-compatible: if this step fails, deploy-report falls back to the existing CURRENT_RUN shape.
        if: always()
        continue-on-error: true
        # Also writes results-summary/results-summary.json (detailed failures for Slack),
        # uploaded below as a tiny artifact so notify needn't re-download every shard.
        run: node runner-repo/.github/scripts/parse-results.js

      - name: Build per-test Results Table
        # Renders merged-report/results-table.html (Passed/Failed/Flaky/Skipped for
        # THIS run), linked from the merged report via the "Results Table" button.
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TEST_ENV: ${{ env.TEST_ENV }}
          BROWSER: ${{ inputs.browser }}
          TEST_PATTERN: ${{ github.event.inputs.test_pattern }}
        run: node runner-repo/.github/scripts/build-main-results-table.js

      - name: Upload merged report artifact
        uses: actions/upload-artifact@v6
        with:
          name: merged-playwright-report
          path: merged-report/
          retention-days: 90

      - name: Upload results summary (for Slack)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-summary
          path: results-summary/
          if-no-files-found: ignore
          retention-days: 30

      - name: Create All-Index artifact
        run: |
          mkdir -p all-index
          for ((i=1; i<=${{ github.event.inputs.shard_count }}; i++)); do
            source_file="all-artifacts/playwright-report-shard-$i/playwright-report/index.html"
            if [ -f "$source_file" ]; then
              cp "$source_file" "all-index/${i}_index.html"
            else
              echo "Warning: $source_file not found"
            fi
          done
          echo "Contents of all-index:"
          ls -l all-index

      - name: Upload All-Index artifact
        uses: actions/upload-artifact@v6
        with:
          name: All-Index
          path: all-index/
          retention-days: 90

  deploy-report:
    name: Deploy Report to GitHub Pages
    timeout-minutes: 10
    if: always()
    needs: [prepare, merge-reports]
    runs-on: ubuntu-latest
    outputs:
      pages_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set Run Info
        id: run-info
        env:
          STARTED_AT: ${{ needs.prepare.outputs.started_at }}
        run: |
          echo "run_number=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
          # Real run start captured by `prepare` (UTC). The old source,
          # github.event.created_at, doesn't exist for workflow_dispatch, so `date -d ""`
          # yielded midnight — every pre-2026-09-24 history entry reads *_000000.
          # Fallback: now (still better than midnight) if prepare's output is missing.
          echo "timestamp=${STARTED_AT:-$(date -u +'%Y%m%d_%H%M%S')}" >> $GITHUB_OUTPUT

      - name: Checkout runner repo for templates
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize gh-pages if needed
        run: |
          if [ ! -d "gh-pages" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            echo "Initializing gh-pages branch..."
          fi

      - name: Download merged report
        uses: actions/download-artifact@v7
        with:
          name: merged-playwright-report
          path: new-report

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build run-history entry
        # jq --arg makes every value a proper JSON string, so quotes/backslashes in
        # run_reason or test_pattern can no longer produce invalid history JSON.
        env:
          RUN_NUMBER: ${{ steps.run-info.outputs.run_number }}
          RUN_TIMESTAMP: ${{ steps.run-info.outputs.timestamp }}
          RUN_REASON: ${{ inputs.run_reason }}
          ENVIRONMENT: ${{ inputs.environment }}
          BROWSER: ${{ inputs.browser }}
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: |
          jq -nc --arg runNumber "$RUN_NUMBER" --arg timestamp "$RUN_TIMESTAMP" \
            --arg runReason "$RUN_REASON" --arg environment "$ENVIRONMENT" \
            --arg browser "$BROWSER" --arg testPattern "$TEST_PATTERN" \
            '{runNumber:$runNumber, timestamp:$timestamp, runReason:$runReason, environment:$environment, browser:$browser, testPattern:$testPattern}' \
            > current-run.json
          mkdir -p new-report/metadata
          cp current-run.json new-report/metadata/run-info.json

          # Merge dashboard counts if merge-reports produced them. If missing (older
          # artifacts, or extraction step failed) the entry keeps its legacy shape and
          # the dashboard treats the run as "unknown".
          if [ -f new-report/run-counts.json ]; then
            jq -c --slurpfile c new-report/run-counts.json '. + $c[0]' current-run.json > current-run.tmp && mv current-run.tmp current-run.json
            echo "Extended entry with dashboard counts"
          else
            echo "No run-counts.json found — keeping legacy entry shape"
          fi

          # Fold the key Run Setup facts in, so the history sidebar can show them and
          # link each run straight to its GitHub Actions page (runId). Older entries
          # simply lack these fields.
          if [ -f new-report/run-setup.json ]; then
            jq -c --slurpfile s new-report/run-setup.json '. + ($s[0] | {
                runId: (.runId | tonumber? // null), triggeredBy, branch, testCommit,
                credentialSet, shardCount: (.shardCount | tonumber? // null), rerunFailed, rerunPasses
              })' current-run.json > current-run.tmp && mv current-run.tmp current-run.json
            echo "Extended entry with run setup (runId, triggeredBy, branch, ...)"
          fi
          cat current-run.json

      - name: Publish report + history to gh-pages
        # Race-safe: if a concurrent run (main or rerun) pushed first, the helper resets
        # to the latest gh-pages and re-applies this run's changes (see the script header).
        env:
          RUN_NUMBER: ${{ steps.run-info.outputs.run_number }}
          RUN_REASON: ${{ inputs.run_reason }}
          NEW_REPORT_DIR: ${{ github.workspace }}/new-report
          CURRENT_RUN_FILE: ${{ github.workspace }}/current-run.json
          HISTORY_TEMPLATE: ${{ github.workspace }}/runner-repo/.github/templates/history-index-template.html
        run: |
          bash runner-repo/.github/scripts/gh-pages-push.sh \
            "$GITHUB_WORKSPACE/runner-repo/.github/scripts/apply-main-run.sh" \
            "Add test report for run #${RUN_NUMBER} (Reason: ${RUN_REASON})"

      - name: Build pruned deploy view
        # Built AFTER the push, from the gh-pages tree that was actually published —
        # so it also includes any run a concurrent pipeline pushed in the meantime.
        env:
          KEEP_LAST: ${{ github.event.inputs.keep_last_runs }}
          RUN_REASON: ${{ inputs.run_reason }}
        run: |
          cd gh-pages
          echo "Evaluating pruning policy for deploy view..."
          # Parse optional min_run=N directive from run_reason; if present it takes priority over keep_last_runs
          MIN_RUN=$(printf '%s' "$RUN_REASON" | sed -n 's/.*min_run=\([0-9]\+\).*/\1/p')
          # keep_last_runs is free text — anything non-numeric falls back to 20
          case "$KEEP_LAST" in ''|*[!0-9]*) KEEP_LAST="20" ;; esac
          # min_run takes priority; only fall back to KEEP_LAST when min_run is absent
          if [ -n "$MIN_RUN" ]; then
            KEEP_LAST=""
          fi
          mkdir -p ../site-deploy
          DEPLOY_DIR="../site-deploy"
          mkdir -p "$DEPLOY_DIR/reports"
          if [ -n "$MIN_RUN" ]; then
            echo "Deploy view: keeping runs with main runNumber >= $MIN_RUN (reruns ride with their parent)"
            # Keep main runs >= min AND reruns whose parent (numeric prefix) is >= min.
            jq --argjson min "$MIN_RUN" '
              ([ .[].runNumber | tostring | select(test("^[0-9]+$")) | tonumber | select(. >= $min) ]) as $keptMain
              | map(select((.runNumber | tostring | split("-")[0] | tonumber?) as $mk | $mk != null and ($keptMain | index($mk) != null)))
              | sort_by(.runNumber | tostring | split("-")[0] | tonumber? // 0) | reverse
            ' run-history.json > "$DEPLOY_DIR/run-history.json"
            mapfile -t KEPT_RUNS < <(jq -r '.[].runNumber' "$DEPLOY_DIR/run-history.json")
          else
            echo "Deploy view: keeping last $KEEP_LAST MAIN runs (their reruns ride along, not counted)"
            # Keep the last N distinct MAIN run numbers, then keep every entry whose
            # main key (numeric prefix) is in that set — so reruns ride with their
            # parent and don't consume the N budget.
            jq --argjson n "$KEEP_LAST" '
              ([ .[].runNumber | tostring | select(test("^[0-9]+$")) | tonumber ] | unique | sort | reverse | .[:$n]) as $keptMain
              | map(select((.runNumber | tostring | split("-")[0] | tonumber?) as $mk | $mk != null and ($keptMain | index($mk) != null)))
              | sort_by(.runNumber | tostring | split("-")[0] | tonumber? // 0) | reverse
            ' run-history.json > "$DEPLOY_DIR/run-history.json"
            mapfile -t KEPT_RUNS < <(jq -r '.[].runNumber' "$DEPLOY_DIR/run-history.json")
          fi
          echo "Deploy will include runs: ${KEPT_RUNS[*]}"
          cp index.html "$DEPLOY_DIR/index.html"
          # Publish full master history alongside the pruned one — dashboard reads master for long-term trends.
          # Pruned run-history.json (above) drives the existing tile view; master is additive and small (~ a few hundred KB).
          if [ -f "run-history.master.json" ]; then
            cp run-history.master.json "$DEPLOY_DIR/run-history.master.json"
            echo "Published run-history.master.json to deploy view"
          fi

          # Copy dashboard template into /dashboard/ subdirectory of the deploy view.
          # The dashboard is self-contained static HTML — it reads ../run-history.master.json
          # and lazy-loads ../reports/{runNumber}/dashboard-summary.json for failure/flaky charts.
          DASHBOARD_TEMPLATE="$GITHUB_WORKSPACE/runner-repo/.github/templates/dashboard-template.html"
          if [ -f "$DASHBOARD_TEMPLATE" ]; then
            mkdir -p "$DEPLOY_DIR/dashboard"
            cp "$DASHBOARD_TEMPLATE" "$DEPLOY_DIR/dashboard/index.html"
            echo "Deployed dashboard to /dashboard/"
          else
            echo "Dashboard template not found at $DASHBOARD_TEMPLATE — skipping (existing site unaffected)"
          fi
          for r in "${KEPT_RUNS[@]}"; do
            if [ -d "reports/$r" ]; then
              mkdir -p "$DEPLOY_DIR/reports/$r"
              rsync -av "reports/$r/" "$DEPLOY_DIR/reports/$r/"
            else
              echo "Warning: reports/$r not found while building deploy payload"
            fi
          done

      - name: Map run numbers to GitHub Actions runs (history sidebar links)
        # Lets the history sidebar link old runs (recorded before entries had a runId)
        # to their Actions page. Non-critical — the page falls back gracefully.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash runner-repo/.github/scripts/build-actions-run-map.sh site-deploy/actions-runs.json

      - name: Handle large files in deploy view
        # Files > 100 MB were skipped by apply-main-run.sh; this documents them on the
        # run's page (info page, per-file placeholders, banner). No-op when none.
        env:
          NEW_REPORT_DIR: ${{ github.workspace }}/new-report
          RUN_DIR: ${{ github.workspace }}/site-deploy/reports/${{ steps.run-info.outputs.run_number }}
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node runner-repo/.github/scripts/build-large-files-info.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Select deploy path
        id: select-deploy
        run: |
          if [ -d "site-deploy" ] && [ -n "$(ls -A site-deploy 2>/dev/null)" ]; then
            echo "path=site-deploy" >> $GITHUB_OUTPUT
          else
            echo "Fallback to gh-pages"
            echo "path=gh-pages" >> $GITHUB_OUTPUT
          fi

      - name: Delete stale Pages artifacts (prevents duplicate on re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On re-runs, previous github-pages artifacts may already exist.
          # deploy-pages fails if it finds >1 artifact with the same name.
          # Delete ALL matching artifacts — not just the first — to handle multiple re-runs.
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages") | .id] | .[]' 2>/dev/null)
          if [ -n "$ARTIFACT_IDS" ]; then
            echo "$ARTIFACT_IDS" | while read -r AID; do
              echo "Deleting stale github-pages artifact (ID: $AID)"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$AID" || true
            done
          else
            echo "No stale github-pages artifacts found — first run"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.select-deploy.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Slack Notification
    if: always()
    needs: [test, deploy-report]
    runs-on: ubuntu-latest
    steps:
      - name: Download results summary
        # Small artifact written by merge-reports (parse-results.js) — replaces
        # re-downloading every shard artifact (~1.5 min on a 20-shard run).
        id: summary
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: results-summary
          path: results-summary

      - name: Checkout runner repo for scripts
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fallback when merge-reports failed before writing the summary: parse the
      # shard artifacts here, as notify used to. NOTE: do NOT use `pattern:` —
      # with one shard download-artifact flattens the directory and every count
      # becomes zero (PR #23). Download everything; the script filters by name.
      - name: Download shard report artifacts (fallback)
        if: steps.summary.outcome != 'success'
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
      - name: Parse shard results (fallback)
        if: steps.summary.outcome != 'success'
        env:
          DASHBOARD_OUT: ""
        run: node runner-repo/.github/scripts/parse-results.js

      - name: Parse results and notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_ENV: ${{ github.event.inputs.environment }}
          BROWSER: ${{ github.event.inputs.browser }}
          TEST_PATTERN: ${{ github.event.inputs.test_pattern }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          RUN_REASON: ${{ github.event.inputs.run_reason }}
          TEST_NEEDS_RESULT: ${{ needs.test.result }}
          PAGES_URL: ${{ needs.deploy-report.outputs.pages_url }}
        run: node runner-repo/.github/scripts/notify-slack.js

  # After the main run has fully finished (tests + Pages deploy + Slack), and ONLY
  # if the rerun_failed checkbox was ticked, dispatch the separate rerun-failures
  # pipeline. It fetches THIS run's failed-test IDs, re-runs just those, and posts
  # its own deploy + Slack. A separate workflow (not an inline job) so the main
  # run's report/Slack land first and the rerun stands as its own labelled run.
  trigger-rerun:
    name: Trigger Failure Rerun
    if: ${{ always() && inputs.rerun_failed }}
    needs: [test, deploy-report, notify]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch rerun-failures workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free-text inputs via env so quotes / $() in them are passed through verbatim.
          BRANCH: ${{ github.event.inputs.branch }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          KEEP_LAST_RUNS: ${{ github.event.inputs.keep_last_runs }}
          RUN_REASON: ${{ github.event.inputs.run_reason }}
        run: |
          gh workflow run rerun-failures.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f source_run_id="${{ github.run_id }}" \
            -f origin_run_number="${{ github.run_number }}" \
            -f branch="$BRANCH" \
            -f environment="$ENVIRONMENT" \
            -f credential_set="${{ github.event.inputs.credential_set }}" \
            -f browser="${{ github.event.inputs.browser }}" \
            -f keep_last_runs="$KEEP_LAST_RUNS" \
            -f distribute_by_test="${{ inputs.distribute_by_test }}" \
            -f log_raw_values="${{ inputs.log_raw_values }}" \
            -f num_retries="${{ github.event.inputs.num_retries }}" \
            -f video_mode="${{ github.event.inputs.video_mode }}" \
            -f trace_mode="${{ github.event.inputs.trace_mode }}" \
            -f run_reason="RETRY FAILURES: $RUN_REASON" \
            -f rerun_passes="${{ github.event.inputs.rerun_passes }}" \
            -f final_pass_slowmo_ms="${{ github.event.inputs.final_pass_slowmo_ms }}" \
            -f pass_number="1"
          echo "Dispatched rerun-failures (pass 1 of ${{ github.event.inputs.rerun_passes }}) for source run ${{ github.run_id }}"
