name: Playwright Tests Runner for WJ-5

on:
  workflow_dispatch:
    inputs:
      keep_last_runs:
        description: "How many recent runs to publish on Pages"
        required: true
        default: "50"
        type: string
      branch: # New input
        description: "Branch in the private repo (SunilsForge/WJ-5_Pub) to run tests from"
        required: true
        default: "main" # Default to main branch
        type: string
      environment:
        description: "Test environment (prodCanada/ prod/ prodTest/ stage/ qa)"
        required: true
        default: "stage"
      test_pattern:
        description: "Test pattern {e.g., @Smoke,   @TestDe|@DerivedScores,   (?=.*@RDGBAS)(?=.*@DerivedScores),    (?=.*@DerivedScores)(?=.*(@PHNMAN|@RDGBAS)),    (?=.*@Smoke)(?=.*(@TestDe|@DerivedScores|@SingleTable|@MultiTable))   }"
        required: true
        default: "(?=.*@RDGBAS)(?=.*@DerivedScores)"
      credential_set:
        description: "Team member credential set (Aut_Eng_01 = default CI creds)"
        required: true
        default: "Aut_Eng_01"
        type: choice
        options:
          - "Aut_Eng_01"
          - "Aut_Eng_02"
          - "Aut_Eng_03"
          - "Aut_Eng_04"
          - "Aut_Eng_05"
          - "Aut_Eng_06"
      shard_count:
        description: "Number of shards"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
          - "8"
          - "10"
          - "15"
          - "20"
          - "25"
      browser:
        description: "Browser to run tests on"
        required: true
        default: "chrome"
        type: choice
        options:
          - "chrome"
          - "firefox"
          - "webkit"
      num_retries:
        description: "Number of test retries"
        required: true
        default: "2"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      video_mode:
        description: "Video recording mode"
        required: true
        default: "off"
        type: choice
        options:
          - "on"
          - "off"
          - "retain-on-failure"
          - "on-first-retry"
          - "retry-with-video"
      trace_mode:
        description: "Trace recording mode"
        required: true
        default: "retain-on-first-failure"
        type: choice
        options:
          - "on"
          - "off"
          - "on-all-retries"
          - "on-first-retry"
          - "retain-on-failure"
          - "retain-on-first-failure"
          - "retry-with-trace"
      run_reason:
        description: "Reason/context for the run (also saved as pre-run notes). You may append optional directives like 'min_run=120'."
        required: true
        default: "Env_@Tag_Reason"
        type: string

env:
  TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'stage' }}
  CREDENTIAL_SET: ${{ github.event.inputs.credential_set }}
  NUM_RETRIES: ${{ github.event.inputs.num_retries }}
  VIDEO_MODE: ${{ github.event.inputs.video_mode }}
  TRACE_MODE: ${{ github.event.inputs.trace_mode }}
  SLOW_MODE_DELAY_IN_MS: 0
  CI: "true"
  PLAYWRIGHT_WORKERS: 1
  NODE_VERSION: "20"

permissions:
  contents: write
  pages: write
  id-token: write

# Keep the existing jobs (prepare, test, merge-reports) unchanged
# Only modify the deploy-report job

jobs:
  # [prepare, test, merge-reports jobs unchanged as per your instruction]
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count }}"
          SHARD_COUNT=${SHARD_COUNT:-1}
          # Dynamically generate shard array [1,2,...,N] — works for any count
          SHARDS=$(seq 1 "$SHARD_COUNT" | jq -cs '.')
          echo "matrix={\"shard\":${SHARDS}}" >> $GITHUB_OUTPUT

      - name: Save pre-run notes
        if: inputs.run_reason != ''
        run: |
          mkdir -p run-metadata
          echo "${{ inputs.run_reason }}" > run-metadata/pre-run-notes.txt

      - name: Upload pre-run notes
        if: inputs.run_reason != ''
        uses: actions/upload-artifact@v6
        with:
          name: run-metadata
          path: run-metadata/
          retention-days: 90

  test:
    needs: prepare
    name: "Shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.prepare.outputs.matrix)}}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: SunilsForge/WJ-5_Pub
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Collect System Information
        run: |
          mkdir -p system-info
          echo "=== System Information for Shard ${{ matrix.shard }} ===" > system-info/specs.txt
          echo "CPU Information:" >> system-info/specs.txt
          lscpu >> system-info/specs.txt
          echo -e "\nMemory Information:" >> system-info/specs.txt
          free -h >> system-info/specs.txt
          echo -e "\nDisk Information:" >> system-info/specs.txt
          df -h >> system-info/specs.txt
          echo -e "\nSystem Load:" >> system-info/specs.txt
          uptime >> system-info/specs.txt
          echo -e "\nContainer Information:" >> system-info/specs.txt
          cat /etc/os-release >> system-info/specs.txt
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install-deps
      - name: Install Playwright browsers
        run: npx playwright install ${{ inputs.browser }}
      - name: Run Playwright tests
        id: run_tests
        continue-on-error: true
        env:
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          SHARD_NUMBER: ${{ matrix.shard }}
          CREDENTIAL_SET: ${{ env.CREDENTIAL_SET }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode }}
          TRACE_MODE: ${{ github.event.inputs.trace_mode }}
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          echo "Running shard ${{ matrix.shard }} of ${{ github.event.inputs.shard_count }}"
          npx cross-env test=${{ env.TEST_ENV }} npx playwright test \
            --grep '${{ github.event.inputs.test_pattern }}' \
            --project=${{ github.event.inputs.browser }} \
            --shard=${{ matrix.shard }}/${{ github.event.inputs.shard_count }} \
            --workers=1 \
            --retries=${{ env.NUM_RETRIES }} \
            --reporter=html,json,blob
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            system-info/
            results.json
            blob-report/
          retention-days: 90
      - name: Create status file
        if: always()
        run: |
          mkdir -p test-status
          echo "${{ steps.run_tests.outcome }}" > test-status/status.txt
          echo "Shard: ${{ matrix.shard }}" >> test-status/status.txt
          echo "Environment: ${{ github.event.inputs.environment }}" >> test-status/status.txt
          echo "Browser: ${{ github.event.inputs.browser }}" >> test-status/status.txt
          echo "Test Pattern: ${{ github.event.inputs.test_pattern }}" >> test-status/status.txt
          echo "Retries: ${{ env.NUM_RETRIES }}" >> test-status/status.txt
          echo "Video Mode: ${{ github.event.inputs.video_mode }}" >> test-status/status.txt
          echo "Trace Mode: ${{ github.event.inputs.trace_mode }}" >> test-status/status.txt
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-status-shard-${{ matrix.shard }}
          path: test-status/
          retention-days: 30

  merge-reports:
    name: Merge Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Checkout runner repo for templates
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Create merged report from template
        run: |
          mkdir -p merged-report
          current_date=$(date +%Y-%m-%d_%H-%M-%S)

          # Copy template
          cp runner-repo/.github/templates/merged-report-template.html merged-report/index.html

          # Build pre-run notes block (HTML-escape user input to prevent XSS)
          PRE_RUN_NOTES=""
          if [ -f "all-artifacts/run-metadata/pre-run-notes.txt" ]; then
            ESCAPED_NOTES=$(cat all-artifacts/run-metadata/pre-run-notes.txt | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            PRE_RUN_NOTES="<div class='notes-section'><h3>Pre-Run Notes</h3><p>${ESCAPED_NOTES}</p></div>"
          fi
          awk -v val="$PRE_RUN_NOTES" '{gsub(/<!-- PRE_RUN_NOTES -->/, val)}1' merged-report/index.html > merged-report/index.tmp && mv merged-report/index.tmp merged-report/index.html

          # Replace simple placeholders
          sed -i "s|__ENVIRONMENT__|${{ inputs.environment }}|g" merged-report/index.html
          sed -i "s|__BROWSER__|${{ inputs.browser }}|g" merged-report/index.html
          sed -i "s|__SHARD_COUNT__|${{ inputs.shard_count }}|g" merged-report/index.html
          sed -i "s|__NUM_RETRIES__|${{ inputs.num_retries }}|g" merged-report/index.html
          sed -i "s|__VIDEO_MODE__|${{ inputs.video_mode }}|g" merged-report/index.html
          sed -i "s|__TRACE_MODE__|${{ inputs.trace_mode }}|g" merged-report/index.html
          sed -i "s|__CURRENT_DATE__|${current_date}|g" merged-report/index.html
          sed -i "s|__GITHUB_RUN_ID__|${{ github.run_id }}|g" merged-report/index.html

          # Replace test_pattern using awk (safe for regex special chars like |, (, ) etc.)
          awk -v val="${{ inputs.test_pattern }}" '{gsub(/__TEST_PATTERN__/, val)}1' merged-report/index.html > merged-report/index.tmp && mv merged-report/index.tmp merged-report/index.html

          # Build shard entries into a temp file
          > shard_entries.html
          for ((i=1; i<=${{ inputs.shard_count }}; i++)); do
            report_source="all-artifacts/playwright-report-shard-$i"
            status_file="all-artifacts/test-status-shard-$i/status.txt"
            system_info_file="$report_source/system-info/specs.txt"
            if [ -d "$report_source" ]; then
              mkdir -p "merged-report/shard-$i"
              # Keep lightweight viewable data (PNG screenshots in playwright-report/data/) so the
              # per-shard report renders failure screenshots inline — matching the native merged report.
              # Excludes: test-results (raw attachments — redundant; playwright-report/data has them),
              #           blob-report (consumed for the native Timeline merge already),
              #           *.zip / *.webm / *.trace (heavy traces & videos — viewable from per-shard artifacts).
              # The deploy-report step applies an additional safety filter (*.mp4, *.gif, *.webp, files >100 MB)
              # when copying onto gh-pages. Full per-test attachments remain in the per-shard GitHub Actions artifact.
              rsync -av --exclude="test-results" --exclude="blob-report" \
                --exclude="*.zip" --exclude="*.webm" --exclude="*.trace" \
                "$report_source/" "merged-report/shard-$i/"
              status="N/A"
              status_class="status-neutral"
              if [ -f "$status_file" ]; then
                status=$(head -n 1 "$status_file")
                if [ "$status" = "success" ]; then
                  status_class="status-success"
                else
                  status_class="status-failure"
                fi
              fi
              # Distinguish "empty" shards (over-allocated — Playwright ran but had no tests to execute)
              # from real passes. Only override a SUCCESS — a failure stays a failure, an N/A stays N/A.
              # If jq can't read the file we leave status untouched (safer than mis-labelling).
              if [ "$status_class" = "status-success" ] && [ -f "$report_source/results.json" ]; then
                test_count=$(jq -r '((.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.skipped // 0) + (.stats.flaky // 0))' "$report_source/results.json" 2>/dev/null)
                if [ "$test_count" = "0" ]; then
                  status="NO TESTS"
                  status_class="status-empty"
                fi
              fi
              system_info="System information not available"
              if [ -f "$system_info_file" ]; then
                system_info=$(cat "$system_info_file")
              fi
              cat << EOF >> shard_entries.html
              <div class='report-wrapper'>
                <div class='report-link'>
                  <span>Shard $i Report</span>
                  <div>
                    <span class='status-badge ${status_class}'>$status</span>
                    <button class='expand-btn' data-shard='$i'>➤</button>
                  </div>
                </div>
                <div class='report-details' id='shard-$i-details'>
                  <div class='system-info-header'>
                    <button class='system-info-toggle' data-shard='$i'>
                      <span class="toggle-arrow">➤</span> System Information
                    </button>
                  </div>
                  <div class='system-info' id='system-info-$i'>
                    <pre>$system_info</pre>
                  </div>
                  <iframe data-src='./shard-$i/playwright-report/index.html'></iframe>
                </div>
              </div>
          EOF
            fi
          done

          # Insert shard entries into template
          sed -i '/<!-- SHARD_ENTRIES -->/r shard_entries.html' merged-report/index.html
          sed -i '/<!-- SHARD_ENTRIES -->/d' merged-report/index.html
          rm -f shard_entries.html
      - name: Generate native Playwright merged report (Timeline)
        run: |
          # Collect blob reports from all shards into a single directory
          mkdir -p all-blob-reports
          for dir in all-artifacts/playwright-report-shard-*/blob-report; do
            if [ -d "$dir" ]; then
              cp "$dir"/* all-blob-reports/ 2>/dev/null || true
            fi
          done

          BLOB_COUNT=$(ls all-blob-reports/ 2>/dev/null | wc -l)
          if [ "$BLOB_COUNT" -gt 0 ]; then
            echo "Found $BLOB_COUNT blob file(s) — generating native merged report..."
            npx playwright merge-reports --reporter=html all-blob-reports || true
            # Playwright outputs to playwright-report/ by default
            if [ -d "playwright-report" ]; then
              mv playwright-report merged-report/playwright-merged
              echo "Native merged report generated at merged-report/playwright-merged/"
            else
              echo "Warning: merge-reports ran but produced no output"
            fi
          else
            echo "No blob reports found — skipping native merge (Timeline will not be available)"
          fi

      - name: Extract counts and failure summary for dashboard
        # Writes two files INTO merged-report/ so they ship with the artifact and reach deploy-report:
        #   run-counts.json        — slim scalars (totalTests, totalPassed, totalFailed, totalSkipped, totalFlaky, durationMs)
        #                            → appended to run-history.master.json by deploy-report
        #   dashboard-summary.json — failure groups (errorType → tests) + flaky test names
        #                            → copied into reports/{runNumber}/ for the dashboard's failure/flaky charts
        # Forward-only: older runs without these files render as "unknown" in the dashboard.
        # Backwards-compatible: if this step fails, deploy-report falls back to the existing CURRENT_RUN shape.
        if: always()
        continue-on-error: true
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const artifactsDir = 'all-artifacts';
          let shardDirs = [];
          try {
            shardDirs = fs.readdirSync(artifactsDir)
              .filter(d => d.startsWith('playwright-report-shard-'))
              .sort((a, b) => parseInt(a.split('-').pop()) - parseInt(b.split('-').pop()));
          } catch (e) {
            console.warn('No artifacts directory — writing empty summary files');
          }

          let totalTests = 0, totalPassed = 0, totalFailed = 0, totalSkipped = 0, totalFlaky = 0;
          let durationMs = 0;
          const failures = [];
          const flakyTests = [];

          // Strip ANSI escape codes — keep parity with notify job
          function stripAnsi(str) {
            return String(str || '').replace(/\x1b\[[0-9;]*m/g, '');
          }
          // Normalize error message so grouping is stable across runs
          function normalizeError(msg) {
            return msg
              .replace(/'[^']*'/g, "'...'")
              .replace(/"[^"]*"/g, '"..."')
              .replace(/\d+ms/g, 'Nms')
              .replace(/locator\('[^']*'\)/g, "locator('...')")
              .replace(/\d+/g, 'N')
              .substring(0, 150);
          }
          function walkSuites(suites) {
            for (const suite of (suites || [])) {
              if (suite.suites) walkSuites(suite.suites);
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  totalTests++;
                  if (test.status === 'expected') {
                    totalPassed++;
                  } else if (test.status === 'unexpected') {
                    totalFailed++;
                    const lastResult = test.results?.[test.results.length - 1];
                    const rawMsg = stripAnsi(lastResult?.error?.message || 'Unknown error');
                    const firstLine = rawMsg.split('\n')[0].trim().substring(0, 200);
                    failures.push({
                      title: spec.title,
                      file: spec.file || '',
                      errorType: normalizeError(firstLine),
                      errorFirstLine: firstLine
                    });
                  } else if (test.status === 'flaky') {
                    totalFlaky++;
                    flakyTests.push({ title: spec.title, file: spec.file || '' });
                  } else if (test.status === 'skipped') {
                    totalSkipped++;
                  }
                  // Sum per-test duration across all attempts for the run-level duration metric
                  for (const r of (test.results || [])) {
                    if (typeof r.duration === 'number') durationMs += r.duration;
                  }
                }
              }
            }
          }

          for (const dir of shardDirs) {
            const jsonPath = path.join(artifactsDir, dir, 'results.json');
            if (!fs.existsSync(jsonPath)) {
              console.warn('Missing', jsonPath);
              continue;
            }
            try {
              const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              walkSuites(report.suites || []);
              // Prefer stats.duration if Playwright provides it — it's wall-clock per shard
              if (report.stats && typeof report.stats.duration === 'number') {
                // overwrite the per-test sum for this shard by re-summing only if stats unavailable;
                // we keep durationMs as sum-of-test-durations above for consistency (test work, not wall-clock).
              }
            } catch (e) {
              console.error('Could not parse', jsonPath, '-', e.message);
            }
          }

          // Group failures by normalized error type
          const groupedMap = {};
          for (const f of failures) {
            if (!groupedMap[f.errorType]) groupedMap[f.errorType] = { errorType: f.errorType, count: 0, errorFirstLine: f.errorFirstLine, tests: [] };
            groupedMap[f.errorType].count++;
            groupedMap[f.errorType].tests.push({ title: f.title, file: f.file });
          }
          const failureGroups = Object.values(groupedMap).sort((a, b) => b.count - a.count);

          fs.mkdirSync('merged-report', { recursive: true });
          const counts = { totalTests, totalPassed, totalFailed, totalSkipped, totalFlaky, durationMs };
          fs.writeFileSync('merged-report/run-counts.json', JSON.stringify(counts));
          console.log('Wrote run-counts.json:', counts);

          const summary = {
            generatedAt: new Date().toISOString(),
            counts,
            failureGroups,
            flakyTests
          };
          fs.writeFileSync('merged-report/dashboard-summary.json', JSON.stringify(summary));
          console.log('Wrote dashboard-summary.json with', failureGroups.length, 'failure groups,', flakyTests.length, 'flaky tests');
          SCRIPT

      - name: Upload merged report artifact
        uses: actions/upload-artifact@v6
        with:
          name: merged-playwright-report
          path: merged-report/
          retention-days: 90

      - name: Create All-Index artifact
        run: |
          mkdir -p all-index
          for ((i=1; i<=${{ github.event.inputs.shard_count }}; i++)); do
            source_file="all-artifacts/playwright-report-shard-$i/playwright-report/index.html"
            if [ -f "$source_file" ]; then
              cp "$source_file" "all-index/${i}_index.html"
            else
              echo "Warning: $source_file not found"
            fi
          done
          echo "Contents of all-index:"
          ls -l all-index

      - name: Upload All-Index artifact
        uses: actions/upload-artifact@v6
        with:
          name: All-Index
          path: all-index/
          retention-days: 90

  # The deploy-report job is completely rewritten
  deploy-report:
    name: Deploy Report to GitHub Pages
    timeout-minutes: 10
    if: always()
    needs: merge-reports
    runs-on: ubuntu-latest
    outputs:
      pages_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set Run Info
        id: run-info
        run: |
          echo "run_number=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
          # Use GitHub's run start time as the execution timestamp
          echo "timestamp=$(date -d "${{ github.event.workflow_run.created_at || github.event.created_at }}" +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Checkout runner repo for templates
        uses: actions/checkout@v5
        with:
          path: runner-repo

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize gh-pages if needed
        run: |
          if [ ! -d "gh-pages" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            echo "Initializing gh-pages branch..."
          fi

      - name: Download merged report
        uses: actions/download-artifact@v7
        with:
          name: merged-playwright-report
          path: new-report

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Organize reports (copy and histories)
        run: |
          cd gh-pages

          # Create directory for new report
          mkdir -p "reports/${{ steps.run-info.outputs.run_number }}"

          # Copy files (excluding large ones)
          echo "Copying files to gh-pages branch directory..."
          rsync -av --exclude="*.zip" --exclude="*.mp4" --exclude="*.webm" \
            --exclude="*.gif" --exclude="*.trace" --exclude="*.webp" --max-size=100M \
            "../new-report/" "reports/${{ steps.run-info.outputs.run_number }}/"

          # Create and Update Run History
          CURRENT_RUN="{\"runNumber\": \"${{ steps.run-info.outputs.run_number }}\", \"timestamp\": \"${{ steps.run-info.outputs.timestamp }}\", \"runReason\": \"${{ inputs.run_reason }}\", \"environment\": \"${{ inputs.environment }}\", \"browser\": \"${{ inputs.browser }}\", \"testPattern\": \"${{ inputs.test_pattern }}\"}"
          mkdir -p "../new-report/metadata"
          echo "$CURRENT_RUN" > "../new-report/metadata/run-info.json"

          # Merge dashboard counts into CURRENT_RUN if merge-reports produced them.
          # If the file is missing (older artifacts, or extraction step failed), CURRENT_RUN
          # stays in its legacy shape — run-history.json keeps working, dashboard treats
          # the run as "unknown".
          if [ -f "../new-report/run-counts.json" ]; then
            COUNTS=$(cat "../new-report/run-counts.json")
            CURRENT_RUN=$(echo "$CURRENT_RUN" | jq --argjson c "$COUNTS" '. + $c' -c)
            echo "Extended CURRENT_RUN with dashboard counts"
          else
            echo "No run-counts.json found — keeping legacy CURRENT_RUN shape"
          fi
          if [ -f "run-history.json" ]; then
            echo "Updating existing run history..."
            jq --argjson newRun "$CURRENT_RUN" '
              if (map(.runNumber == $newRun.runNumber) | any) then
                map(if .runNumber == $newRun.runNumber then $newRun else . end)
              else
                . + [$newRun]
              end | sort_by(.runNumber | tonumber) | reverse
            ' run-history.json > run-history.tmp
            mv run-history.tmp run-history.json
          else
            echo "Creating new run history..."
            echo "[$CURRENT_RUN]" > run-history.json
          fi
          echo "Contents of run history file:"
          cat run-history.json

          # Also persist an explicitly named full copy for clarity (never pruned)
          if [ -f "run-history.master.json" ]; then
            echo "Updating master run history..."
            jq --argjson newRun "$CURRENT_RUN" '
              if (map(.runNumber == $newRun.runNumber) | any) then
                map(if .runNumber == $newRun.runNumber then $newRun else . end)
              else
                . + [$newRun]
              end | sort_by(.runNumber | tonumber) | reverse
            ' run-history.master.json > run-history.master.tmp && mv run-history.master.tmp run-history.master.json
          else
            echo "Creating master run history..."
            cp run-history.json run-history.master.json
          fi

      - name: Build pruned deploy view
        run: |
          cd gh-pages
          echo "Evaluating pruning policy for deploy view..."
          # Parse optional min_run=N directive from run_reason; if present it takes priority over keep_last_runs
          KEEP_LAST="${{ github.event.inputs.keep_last_runs }}"
          RUN_REASON="${{ inputs.run_reason }}"
          MIN_RUN=$(echo "$RUN_REASON" | sed -n 's/.*min_run=\([0-9]\+\).*/\1/p')
          # min_run takes priority; only fall back to KEEP_LAST when min_run is absent
          if [ -n "$MIN_RUN" ]; then
            KEEP_LAST=""
          elif [ -z "$KEEP_LAST" ]; then
            KEEP_LAST="50"
          fi
          mkdir -p ../site-deploy
          DEPLOY_DIR="../site-deploy"
          mkdir -p "$DEPLOY_DIR/reports"
          if [ -n "$MIN_RUN" ]; then
            echo "Deploy view: keeping runs with runNumber >= $MIN_RUN"
            jq --argjson min "$MIN_RUN" '[.[] | select((.runNumber|tonumber) >= $min)] | sort_by(.runNumber | tonumber) | reverse' run-history.json > "$DEPLOY_DIR/run-history.json"
            mapfile -t KEPT_RUNS < <(jq -r '.[].runNumber' "$DEPLOY_DIR/run-history.json")
          else
            echo "Deploy view: keeping last $KEEP_LAST runs"
            jq --argjson n "$KEEP_LAST" 'sort_by(.runNumber | tonumber) | reverse | .[:$n]' run-history.json > "$DEPLOY_DIR/run-history.json"
            mapfile -t KEPT_RUNS < <(jq -r '.[].runNumber' "$DEPLOY_DIR/run-history.json")
          fi
          echo "Deploy will include runs: ${KEPT_RUNS[*]}"
          cp index.html "$DEPLOY_DIR/index.html"
          # Publish full master history alongside the pruned one — dashboard reads master for long-term trends.
          # Pruned run-history.json (above) drives the existing tile view; master is additive and small (~ a few hundred KB).
          if [ -f "run-history.master.json" ]; then
            cp run-history.master.json "$DEPLOY_DIR/run-history.master.json"
            echo "Published run-history.master.json to deploy view"
          fi

          # Copy dashboard template into /dashboard/ subdirectory of the deploy view.
          # The dashboard is self-contained static HTML — it reads ../run-history.master.json
          # and lazy-loads ../reports/{runNumber}/dashboard-summary.json for failure/flaky charts.
          DASHBOARD_TEMPLATE="$GITHUB_WORKSPACE/runner-repo/.github/templates/dashboard-template.html"
          if [ -f "$DASHBOARD_TEMPLATE" ]; then
            mkdir -p "$DEPLOY_DIR/dashboard"
            cp "$DASHBOARD_TEMPLATE" "$DEPLOY_DIR/dashboard/index.html"
            echo "Deployed dashboard to /dashboard/"
          else
            echo "Dashboard template not found at $DASHBOARD_TEMPLATE — skipping (existing site unaffected)"
          fi
          for r in "${KEPT_RUNS[@]}"; do
            if [ -d "reports/$r" ]; then
              mkdir -p "$DEPLOY_DIR/reports/$r"
              rsync -av "reports/$r/" "$DEPLOY_DIR/reports/$r/"
            else
              echo "Warning: reports/$r not found while building deploy payload"
            fi
          done

      - name: Handle large files in deploy view
        run: |
          cd gh-pages
          DEPLOY_DIR="../site-deploy"
          RUN_DIR="$DEPLOY_DIR/reports/${{ steps.run-info.outputs.run_number }}"
          mkdir -p "$RUN_DIR/large-files-info"
          echo "Checking for large files..."
          max_file_size=$((100 * 1024 * 1024)) # 100MB in bytes
          find ../new-report -type f -size +${max_file_size}c | while read -r file; do
            file_size=$(du -b "$file" | cut -f1)
            file_size_mb=$(echo "scale=2; $file_size / 1048576" | bc)
            relative_path=${file#../new-report/}
            echo "Large file detected: $relative_path ($file_size_mb MB)"
            echo "Large file detected: $relative_path ($file_size_mb MB)" >> large_files_list.txt
          done
          if [ -s large_files_list.txt ]; then
            cp large_files_list.txt "$RUN_DIR/large-files-info/"
            cat > "$RUN_DIR/large-files-info/index.html" << EOF
            <!DOCTYPE html>
            <html>
            <head>
              <title>Large Files Information</title>
              <style>
                body { font-family: -apple-system, system-ui, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
                .warning { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 20px; }
                .info-box { background: #e7f5fe; border-left: 4px solid #0366d6; padding: 15px; margin-bottom: 20px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
                th { background-color: #f6f8fa; }
                .artifact-link { display: inline-block; background: #0366d6; color: white; padding: 6px 12px; 
                                text-decoration: none; border-radius: 4px; margin-top: 10px; }
                .artifact-link:hover { background: #0258b8; }
              </style>
            </head>
            <body>
              <h1>Large Files Excluded from GitHub Pages</h1>
              <div class="warning">
                <h3>⚠️ Some files were too large to be included in the GitHub Pages deployment</h3>
                <p>GitHub has a 100MB file size limit for regular Git repositories. The files listed below exceeded this limit 
                and were excluded from the deployment.</p>
              </div>
              <div class="info-box">
                <h3>📋 Access Complete Artifacts</h3>
                <p>You can access the complete test results, including these large files, from the GitHub Actions artifacts.</p>
                <p>The artifacts are stored for 90 days and contain all test results, including videos, traces, and screenshots.</p>
                <p>To download the artifacts:</p>
                <ol>
                  <li>Go to the GitHub Actions run page (link below)</li>
                  <li>Scroll down to the "Artifacts" section</li>
                  <li>Download the artifact that includes your files of interest</li>
                </ol>
                <p><strong>Note:</strong> Large video and trace files are typically most useful for debugging test failures.</p>
              </div>
              <h2>Excluded Files</h2>
              <table>
                <tr>
                  <th>File Path</th>
                  <th>Size</th>
                </tr>
            EOF
            while IFS= read -r line; do
              if [[ $line == Large\ file\ detected:* ]]; then
                file_path=$(echo "$line" | sed 's/Large file detected: \(.*\) (\(.*\) MB)/\1/')
                file_size=$(echo "$line" | sed 's/Large file detected: \(.*\) (\(.*\) MB)/\2/')
                echo "          <tr>
                  <td>$file_path</td>
                  <td>$file_size MB</td>
                </tr>" >> "$RUN_DIR/large-files-info/index.html"
                placeholder_dir=$(dirname "$RUN_DIR/$file_path")
                mkdir -p "$placeholder_dir"
                placeholder_file_html="${placeholder_dir}/$(basename "${file_path%.*}").html"
                cat > "$placeholder_file_html" << EOF_PLACEHOLDER
                <!DOCTYPE html>
                <html>
                <head>
                  <title>Large File Placeholder</title>
                  <style>
                    body { font-family: -apple-system, system-ui, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; text-align: center; }
                    .warning { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 20px; text-align: left; }
                    .info { margin: 30px 0; }
                    .link { display: inline-block; background: #0366d6; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; }
                    .link:hover { background: #0258b8; }
                  </style>
                </head>
                <body>
                  <h1>Large File Placeholder</h1>
                  <div class="warning">
                    <h3>⚠️ This file was too large to be included in GitHub Pages</h3>
                    <p>The original file <strong>$(basename "$file_path")</strong> is $file_size MB, which exceeds GitHub's 100MB limit.</p>
                  </div>
                  <div class="info">
                    <p>Please refer to the GitHub Actions artifacts to access the complete file.</p>
                  </div>
                  <a href="../../large-files-info/index.html" class="link">View All Large Files Info</a>
                </body>
                </html>
          EOF_PLACEHOLDER
              fi
            done < large_files_list.txt
            cat >> "$RUN_DIR/large-files-info/index.html" << EOF
              </table>
              <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                 class="artifact-link" target="_blank" style="font-size: 16px; padding: 12px 24px; text-align: center; display: block; margin: 20px auto; max-width: 300px;">
                📥 Download Complete Artifacts
              </a>
              <p style="text-align: center; margin-top: 5px; color: #586069;">Artifacts include all videos, traces, and large files</p>
            </body>
            </html>
          EOF
            if [ -f "$RUN_DIR/index.html" ]; then
              sed -i '/<body>/a \
              <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin: 20px 0;"> \
                <h3 style="margin-top: 0;">⚠️ Some files were too large to be included in this report</h3> \
                <p>Some large files from test results have been excluded from this GitHub Pages deployment due to GitHub file size limits.</p> \
                <p><a href="large-files-info/index.html" style="color: #0366d6;">View information about excluded files</a></p> \
              </div>' "$RUN_DIR/index.html"
            fi
          fi


          # Copy history index template (fully static — loads run-history.json client-side)
          cp "$GITHUB_WORKSPACE/runner-repo/.github/templates/history-index-template.html" index.html

      - name: Configure Git
        run: |
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Commit and Push Changes
        run: |
          cd gh-pages
          git fetch origin gh-pages

          # Check if gh-pages branch exists locally
          if [ -z "$(git branch --list gh-pages)" ]; then
            git checkout -b gh-pages
          else
            git checkout gh-pages
          fi

          # Stage and commit changes from Organize reports before pulling
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committing changes before pulling..."
            git add .
            git commit -m "Add test report for run #${{ steps.run-info.outputs.run_number }} (Reason: ${{ inputs.run_reason }}) - Initial commit"
          fi

          # Pull with rebase to integrate upstream changes
          git pull origin gh-pages --rebase --allow-unrelated-histories

          # Commit any additional changes after rebase (unlikely but possible)
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committing additional changes after rebase..."
            git add .
            git commit -m "Add test report for run #${{ steps.run-info.outputs.run_number }} (Reason: ${{ inputs.run_reason }}) - Post-rebase commit"
          fi

          # Push with retry logic if there are commits ahead
          if [ "$(git log origin/gh-pages..HEAD --oneline | wc -l)" -gt 0 ]; then
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if git push origin gh-pages; then
                echo "Push successful"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
                git fetch origin gh-pages
                git rebase origin/gh-pages
                [ $RETRY_COUNT -eq $MAX_RETRIES ] && exit 1
                sleep 5
              fi
            done
          else
            echo "No changes to push after rebase"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Select deploy path
        id: select-deploy
        run: |
          if [ -d "site-deploy" ] && [ -n "$(ls -A site-deploy 2>/dev/null)" ]; then
            echo "path=site-deploy" >> $GITHUB_OUTPUT
          else
            echo "Fallback to gh-pages"
            echo "path=gh-pages" >> $GITHUB_OUTPUT
          fi

      - name: Delete stale Pages artifacts (prevents duplicate on re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On re-runs, previous github-pages artifacts may already exist.
          # deploy-pages fails if it finds >1 artifact with the same name.
          # Delete ALL matching artifacts — not just the first — to handle multiple re-runs.
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages") | .id] | .[]' 2>/dev/null)
          if [ -n "$ARTIFACT_IDS" ]; then
            echo "$ARTIFACT_IDS" | while read -r AID; do
              echo "Deleting stale github-pages artifact (ID: $AID)"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$AID" || true
            done
          else
            echo "No stale github-pages artifacts found — first run"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.select-deploy.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Slack Notification
    if: always()
    needs: [test, deploy-report]
    runs-on: ubuntu-latest
    steps:
      - name: Download shard report artifacts
        # NOTE: do NOT use `pattern: playwright-report-shard-*` here.
        # When only one artifact matches the pattern (shard_count: 1), download-artifact@v4+
        # skips the per-artifact subdirectory and extracts files directly into `path`.
        # The downstream `startsWith('playwright-report-shard-')` filter then finds nothing,
        # leading to all-zero counts in Slack/Step Summary on single-shard runs.
        # Downloading everything (like the merge-reports job does) guarantees per-artifact
        # subdirectories regardless of shard_count. The extra small artifacts are filtered out.
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Parse results and notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_ENV: ${{ github.event.inputs.environment }}
          BROWSER: ${{ github.event.inputs.browser }}
          TEST_PATTERN: ${{ github.event.inputs.test_pattern }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
          RUN_REASON: ${{ github.event.inputs.run_reason }}
          TEST_NEEDS_RESULT: ${{ needs.test.result }}
          PAGES_URL: ${{ needs.deploy-report.outputs.pages_url }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const { URL } = require('url');

          // ── Parse all shard results.json files ──
          const artifactsDir = 'all-artifacts';
          let shardDirs = [];
          try {
            shardDirs = fs.readdirSync(artifactsDir)
              .filter(d => d.startsWith('playwright-report-shard-'))
              .sort((a, b) => {
                const numA = parseInt(a.split('-').pop());
                const numB = parseInt(b.split('-').pop());
                return numA - numB;
              });
          } catch (e) {
            console.error('Could not read artifacts directory:', e.message);
          }

          let totalPassed = 0;
          let totalFailed = 0;
          let totalSkipped = 0;
          let totalFlaky = 0;
          let totalTests = 0;
          let shardsWithJson = 0;
          const shardsMissingJson = [];
          const failures = [];

          // Strip ANSI escape codes (terminal colors) so errors render cleanly in Slack/GitHub
          function stripAnsi(str) {
            return str.replace(/\u001b\[[0-9;]*m/g, '').replace(/\x1b\[[0-9;]*m/g, '');
          }

          // Normalize error message for grouping: strip specific values, keep the pattern
          function normalizeError(msg) {
            return msg
              .replace(/'[^']*'/g, "'...'")
              .replace(/"[^"]*"/g, '"..."')
              .replace(/\d+ms/g, 'Nms')
              .replace(/locator\('[^']*'\)/g, "locator('...')")
              .replace(/\d+/g, 'N')
              .substring(0, 150);
          }

          // Recursively walk Playwright JSON report suites to extract test results
          function walkSuites(suites) {
            for (const suite of (suites || [])) {
              if (suite.suites) walkSuites(suite.suites);
              for (const spec of (suite.specs || [])) {
                for (const test of (spec.tests || [])) {
                  totalTests++;
                  // Playwright statuses: expected=passed, unexpected=failed, flaky, skipped
                  if (test.status === 'expected') {
                    totalPassed++;
                  } else if (test.status === 'unexpected') {
                    totalFailed++;
                    const lastResult = test.results?.[test.results.length - 1];
                    const rawMsg = lastResult?.error?.message || 'No error message available';
                    const rawStack = lastResult?.error?.stack || '';
                    const cleanMsg = stripAnsi(rawMsg);
                    const cleanStack = stripAnsi(rawStack);
                    const msgLines = cleanMsg.split('\n').map(l => l.trim()).filter(Boolean);
                    const stackLines = cleanStack.split('\n').map(l => l.trim()).filter(Boolean);

                    // Line 1: error type (e.g., "TimeoutError: locator.fill: Timeout 60000ms exceeded.")
                    const errorType = msgLines[0] || 'Unknown error';
                    // Call log line: "- waiting for getByLabel('First Name*,...')"
                    const callLogLine = msgLines.find(l => l.startsWith('- waiting for') || l.startsWith('- locator'));
                    // File + line from stack trace: "at ../pages/wj5_dashBoard.page.ts:233"
                    // Check both message and stack — Playwright puts the location in the stack
                    const allLines = [...msgLines, ...stackLines];
                    const fileLine = allLines.find(l => /^at\s+/.test(l) && /\.(page|spec|ts|js)[:\d]*/.test(l));

                    // Build detailed error: type + what it was doing + where
                    let detailedError = errorType.substring(0, 200);
                    if (callLogLine) detailedError += '\n' + callLogLine.substring(0, 200);
                    if (fileLine) detailedError += '\n' + fileLine.substring(0, 200);

                    failures.push({
                      title: spec.title,
                      file: spec.file || '',
                      error: detailedError,
                      errorType: normalizeError(errorType)
                    });
                  } else if (test.status === 'flaky') {
                    totalFlaky++;
                  } else if (test.status === 'skipped') {
                    totalSkipped++;
                  }
                }
              }
            }
          }

          for (const dir of shardDirs) {
            const jsonPath = path.join(artifactsDir, dir, 'results.json');
            if (!fs.existsSync(jsonPath)) {
              shardsMissingJson.push(dir.split('-').pop());
              console.warn(`Warning: ${jsonPath} not found`);
              continue;
            }
            try {
              const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              shardsWithJson++;
              walkSuites(report.suites || []);
            } catch (e) {
              console.error(`Error parsing ${jsonPath}:`, e.message);
              shardsMissingJson.push(dir.split('-').pop());
            }
          }

          // ── Determine overall status ──
          const overallFailed = totalFailed > 0 || process.env.TEST_NEEDS_RESULT === 'failure';
          const statusText = overallFailed ? 'FAILED' : 'PASSED';

          // ── Group failures by normalized error type (most frequent first) ──
          const grouped = {};
          for (const f of failures) {
            const key = f.errorType;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(f);
          }
          const groupedEntries = Object.entries(grouped)
            .sort((a, b) => b[1].length - a[1].length);

          // ── Build URLs ──
          const repo = process.env.GITHUB_REPOSITORY;
          const runId = process.env.GITHUB_RUN_ID;
          const runNumber = process.env.GITHUB_RUN_NUMBER;
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const repoName = repo.split('/')[1];
          const actionsUrl = `https://github.com/${repo}/actions/runs/${runId}`;
          // Use actual deployed URL from deploy-report job; fall back to convention if deploy was skipped
          const pagesUrl = process.env.PAGES_URL || `https://${owner}.github.io/${repoName}/`;

          // ── Write GitHub Step Summary (markdown table in Actions UI) ──
          let summary = `## ${overallFailed ? '\u{1F534}' : '\u{1F7E2}'} Playwright Test Results — Run #${runNumber}\n\n`;
          summary += `**Environment:** ${process.env.TEST_ENV} | **Browser:** ${process.env.BROWSER} | **Shards:** ${process.env.SHARD_COUNT}\n\n`;
          summary += `| Metric | Count |\n|---|---|\n`;
          summary += `| Total | ${totalTests} |\n`;
          summary += `| Passed | ${totalPassed} |\n`;
          summary += `| Failed | ${totalFailed} |\n`;
          summary += `| Skipped | ${totalSkipped} |\n`;
          summary += `| Flaky | ${totalFlaky} |\n\n`;
          if (groupedEntries.length > 0) {
            // Helper: escape pipe chars and replace newlines with <br> for markdown table cells
            function mdCell(str) {
              return str.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
            }

            // Section A: Grouped by error type
            summary += `### Failure Analysis\n\n`;
            summary += `| Sl.No | Test Cases | Count | Error Reason |\n|---|---|---|---|\n`;
            groupedEntries.forEach(([errorType, tests], idx) => {
              const tcList = tests.map(t => `${mdCell(t.title)} (${mdCell(t.file)})`).join(', ');
              // Show detailed error — use <br> outside backticks so HTML renders properly
              const errorParts = tests[0].error.split('\n').map(l => l.replace(/\|/g, '\\|'));
              const detailedError = errorParts.map(p => `\`${p}\``).join('<br>');
              summary += `| ${idx + 1} | ${tcList} | ${tests.length} | ${detailedError} |\n`;
            });
            summary += '\n';

            // Section B: Detailed per-TC failures
            summary += `### Detailed Failures\n\n`;
            summary += `| # | Test Case | File | Error |\n|---|---|---|---|\n`;
            failures.forEach((f, idx) => {
              const errorParts = f.error.split('\n').map(l => l.replace(/\|/g, '\\|'));
              const detailedError = errorParts.map(p => `\`${p}\``).join('<br>');
              summary += `| ${idx + 1} | ${mdCell(f.title)} | ${mdCell(f.file)} | ${detailedError} |\n`;
            });
            summary += '\n';
          }
          summary += `[Full Report](${pagesUrl}) | [Actions Run](${actionsUrl})\n`;

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (summaryPath) {
            fs.appendFileSync(summaryPath, summary);
            console.log('Wrote GitHub Step Summary');
          }

          // ── Build Slack Block Kit message ──
          const blocks = [
            {
              type: 'header',
              text: {
                type: 'plain_text',
                text: `${overallFailed ? '\u{1F534}' : '\u{1F7E2}'} Playwright Run #${runNumber} — ${statusText}`,
                emoji: true
              }
            },
            {
              type: 'section',
              fields: [
                { type: 'mrkdwn', text: `*Environment:*\n${process.env.TEST_ENV}` },
                { type: 'mrkdwn', text: `*Browser:*\n${process.env.BROWSER}` },
                { type: 'mrkdwn', text: `*Shards:*\n${process.env.SHARD_COUNT}` },
                { type: 'mrkdwn', text: `*Reason:*\n${process.env.RUN_REASON || 'N/A'}` }
              ]
            },
            {
              type: 'section',
              fields: [
                { type: 'mrkdwn', text: `*Total:* ${totalTests}` },
                { type: 'mrkdwn', text: `*Passed:* ${totalPassed} :white_check_mark:` },
                { type: 'mrkdwn', text: `*Failed:* ${totalFailed} :x:` },
                { type: 'mrkdwn', text: `*Skipped:* ${totalSkipped} :fast_forward:  *Flaky:* ${totalFlaky} :warning:` }
              ]
            }
          ];

          // Warn if some shards had no JSON results
          if (shardsMissingJson.length > 0) {
            blocks.push({
              type: 'context',
              elements: [{
                type: 'mrkdwn',
                text: `:warning: JSON results missing for shard(s): ${shardsMissingJson.join(', ')}. Counts may be incomplete.`
              }]
            });
          }

          // Add simple grouped failure summary for Slack (detailed tables are in GitHub Step Summary)
          if (groupedEntries.length > 0) {
            blocks.push({ type: 'divider' });
            let failText = groupedEntries.slice(0, 10)
              .map(([ , tests], idx) => {
                const errorFirstLine = tests[0].error.split('\n')[0];
                return `${idx + 1}. \`${errorFirstLine}\` — *${tests.length} test(s)*`;
              })
              .join('\n');
            if (groupedEntries.length > 10) {
              failText += `\n_...and ${groupedEntries.length - 10} more error groups_`;
            }
            blocks.push({
              type: 'section',
              text: { type: 'mrkdwn', text: `*Failed Tests (grouped by error):*\n${failText}` }
            });
          }

          // Action buttons linking to full report and Actions run
          blocks.push({ type: 'divider' });
          blocks.push({
            type: 'actions',
            elements: [
              {
                type: 'button',
                text: { type: 'plain_text', text: 'Full Report', emoji: true },
                url: pagesUrl,
                style: 'primary'
              },
              {
                type: 'button',
                text: { type: 'plain_text', text: 'GitHub Actions Run', emoji: true },
                url: actionsUrl
              }
            ]
          });

          // ── Send Slack webhook ──
          const webhookUrl = process.env.SLACK_WEBHOOK_URL;
          if (!webhookUrl) {
            console.log('SLACK_WEBHOOK_URL not set — skipping Slack notification.');
            console.log('Message payload (for dry-run verification):');
            console.log(JSON.stringify({ blocks }, null, 2));
            process.exit(0);
          }

          const payload = JSON.stringify({ blocks });
          const parsed = new URL(webhookUrl);

          const req = https.request({
            hostname: parsed.hostname,
            port: 443,
            path: parsed.pathname,
            method: 'POST',
            timeout: 15000, // 15s timeout to avoid hanging if Slack is unresponsive
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload)
            }
          }, (res) => {
            let body = '';
            res.on('data', chunk => body += chunk);
            res.on('end', () => {
              if (res.statusCode === 200) {
                console.log('Slack notification sent successfully');
              } else {
                console.error(`Slack webhook returned ${res.statusCode}: ${body}`);
                process.exit(1);
              }
            });
          });

          req.on('timeout', () => {
            console.error('Slack webhook timed out after 15s');
            req.destroy();
            process.exit(1);
          });

          req.on('error', (e) => {
            console.error('Failed to send Slack notification:', e.message);
            process.exit(1);
          });

          req.write(payload);
          req.end();
          SCRIPT
