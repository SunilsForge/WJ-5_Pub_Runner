<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rerun of #__SOURCE_RUN__</title>
  <style>
    body{font-family:-apple-system,system-ui,sans-serif;margin:24px;background:#f6f8fa;color:#1b1f24}
    h1{margin:0 0 4px}
    .meta{color:#57606a;margin-bottom:16px}
    .cards{display:flex;gap:12px;margin:16px 0}
    .card{background:#fff;border:1px solid #eaeef2;border-radius:6px;padding:12px 18px;min-width:120px}
    .card b{display:block;font-size:24px}
    .ok b{color:#1a7f37}
    .bad b{color:#cf222e}
    table{border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;width:100%;margin:8px 0 20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    th,td{padding:7px 12px;border-bottom:1px solid #eaeef2;text-align:left;font-size:13px}
    th{background:#f0f3f6}
    .mono{font-family:ui-monospace,monospace;color:#57606a}
    .empty{color:#8c959f;font-style:italic}
  </style>
</head>
<body>
  <h1>&#128257; Rerun of Run #__SOURCE_RUN__</h1>
  <div class="meta">__RUN_REASON__ &middot; Env <code>__ENV__</code> &middot; Browser <code>__BROWSER__</code></div>
  <div class="cards">
    <div class="card"><b>__RERAN__</b>re-run</div>
    <div class="card ok"><b>__FLAKY__</b>now passing (flaky)</div>
    <div class="card bad"><b>__STILL__</b>still failing (real)</div>
  </div>
  <h2>Still failing (real)</h2>
  <table><thead><tr><th>#</th><th>Test</th><th>File</th></tr></thead><tbody><!-- STILL_ROWS --></tbody></table>
  <h2>Now passing on rerun (flaky)</h2>
  <table><thead><tr><th>#</th><th>Test</th><th>File</th></tr></thead><tbody><!-- FLAKY_ROWS --></tbody></table>
</body>
</html>
