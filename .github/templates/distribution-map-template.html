<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shard Distribution Map</title>
  <style>
    body{font-family:-apple-system,system-ui,Segoe UI,sans-serif;margin:24px;color:#1b1f24;background:#f6f8fa}
    h1{margin:0 0 4px}
    .meta{color:#57606a;margin-bottom:20px;font-size:14px}
    .meta code{background:#eaeef2;padding:2px 6px;border-radius:4px}
    table{border-collapse:collapse;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);border-radius:6px;overflow:hidden}
    th,td{padding:7px 12px;border-bottom:1px solid #eaeef2;text-align:left;font-size:13px;vertical-align:top}
    th{background:#f0f3f6;font-weight:600}
    .summary{margin-bottom:24px}
    .summary td:not(:first-child){text-align:right}
    tr.empty{color:#8c959f;background:#fbfcfd}
    tr.heavy{background:#fff8e5}
    details{background:#fff;border:1px solid #eaeef2;border-radius:6px;margin:8px 0;padding:4px 12px}
    summary{cursor:pointer;padding:8px 0;font-size:14px}
    table.detail{width:100%;margin:8px 0 12px}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:#57606a;white-space:nowrap}
    .chip{display:inline-block;background:#ddf4ff;color:#0969da;border-radius:10px;padding:1px 8px;font-size:11px;margin:1px}
    .empty-note{color:#8c959f;font-style:italic;padding:4px 0}
    .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .card{background:#fff;border:1px solid #eaeef2;border-radius:6px;padding:12px 18px;min-width:120px}
    .card b{display:block;font-size:22px}
  </style>
</head>
<body>
  <h1>Shard Distribution Map</h1>
  <div class="meta">
    Env <code>__ENV__</code> &middot;
    Browser <code>__BROWSER__</code> &middot;
    Pattern <code>__PATTERN__</code> &middot;
    Per-test distribution: <code>__DIST__</code>
  </div>
  <div class="cards">
    <div class="card"><b>__SHARD_COUNT__</b>shards</div>
    <div class="card"><b>__TOTAL_TESTS__</b>total tests</div>
    <div class="card"><b>__MIN_MAX__</b>tests/shard</div>
  </div>
  <h2>Per-shard counts</h2>
  <table class="summary"><thead><tr><th>Shard</th><th>Tests</th><th>Files</th></tr></thead><tbody><!-- SUMMARY_ROWS --></tbody></table>
  <h2>Tag frequency (all shards)</h2>
  <table class="summary"><thead><tr><th>Tag</th><th>Tests</th></tr></thead><tbody><!-- TAG_ROWS --></tbody></table>
  <h2>Tests per shard</h2>
  <!-- SHARD_SECTIONS -->
</body>
</html>
